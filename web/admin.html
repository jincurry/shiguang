<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光集 · 暗房工作台</title>
<style>
  /* 不加载网络字体：CSS @import 是渲染阻塞的，fonts.googleapis.com 在部分
     网络环境不可达时会让整页白屏干等十几秒。下面的字体栈已覆盖
     macOS(PingFang/Songti)、Windows(微软雅黑/宋体)、iOS、Android 中文系统。 */
  :root{
    --bg:#161310; --bg-soft:#1D1915; --panel:#1A1613;
    --ivory:#EDE5D8; --muted:#9A8E7E; --faint:#5E564A;
    --amber:#D9A05B; --safelight:#D4553B; --ok:#7FA65A;
    --line:#332D25; --hairline:rgba(51,45,37,.6);
    --print:#F7F2E8; --paper-raw:#E7DFC9; --print-ink:#4A4238; --print-sub:#8C8172;
    --serif:'Noto Serif SC','Songti SC',serif;
    --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    --mono:ui-monospace,'SF Mono',Consolas,monospace;
    --grain:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="140" height="140" filter="url(%23n)" opacity="0.5"/></svg>');
  }
  body.light{
    --bg:#EFEAE0; --bg-soft:#F7F3EA; --panel:#F5F1E8;
    --ivory:#2E2A24; --muted:#7C7263; --faint:#A89D8B;
    --amber:#8F6A2A; --safelight:#C24A32; --ok:#5E7F3F;
    --line:#DCD4C4; --hairline:rgba(190,178,156,.6);
    --print:#FFFDF8; --paper-raw:#EFE9DA;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--ivory);font-family:var(--sans);
    line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;
    transition:background-color .5s ease,color .5s ease;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(700px 400px at 80% -8%,rgba(212,85,59,.10),transparent 70%),
               radial-gradient(520px 340px at 6% 2%,rgba(217,160,91,.06),transparent 70%);
  }
  body.light::before{
    background:radial-gradient(760px 420px at 80% -8%,rgba(255,220,160,.5),transparent 70%),
               radial-gradient(560px 360px at 6% 2%,rgba(255,240,214,.45),transparent 70%);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:80;
    background-image:var(--grain);opacity:.05;mix-blend-mode:overlay;
  }
  body.light::after{opacity:.035;}
  /* 亮色下的深色硬编码组件覆盖 */
  body.light .topbar{background:rgba(239,234,224,.88);}
  body.light .btn{color:#FBF6EA;}
  body.light .ops button{background:rgba(255,253,246,.9);color:var(--ivory);
    box-shadow:0 1px 4px rgba(90,75,55,.25);}
  body.light .ops button:hover{background:var(--safelight);color:#fff;}
  body.light .card{box-shadow:0 2px 5px rgba(90,75,55,.18),0 10px 24px rgba(90,75,55,.16);}
  body.light .modal{background:rgba(243,238,228,.72);}
  body.light .toast{background:rgba(255,253,246,.96);box-shadow:0 8px 24px rgba(90,75,55,.25);}
  body.light .door{box-shadow:0 24px 60px rgba(90,75,55,.28);}

  /* 拉线开关：从顶栏底下垂下来 */
  .cord{
    position:fixed;top:0;right:min(4vw,44px);z-index:35;
    width:28px;height:118px;
    display:flex;flex-direction:column;align-items:center;
    transform-origin:top center;
  }
  .cord-line{width:2px;flex:1;background:linear-gradient(180deg,#4A4133,#8A7A5F);border-radius:1px;}
  .cord-knob{
    width:13px;height:24px;border-radius:7px;margin-top:-1px;
    background:linear-gradient(180deg,#D9A05B,#8F6A2A);
    box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);
    transition:box-shadow .3s ease;
  }
  .cord:hover .cord-knob{box-shadow:0 2px 10px rgba(217,160,91,.6),inset 0 1px 0 rgba(255,255,255,.35);}
  .cord.pulled{animation:cordPull .55s cubic-bezier(.3,.7,.35,1.3);}
  body.in-app .cord{display:none;}   /* 工作台内主题切换走顶栏按钮，拉绳只在登录页 */
  @keyframes cordPull{
    0%{transform:translateY(0);}35%{transform:translateY(15px);}
    70%{transform:translateY(-3px);}100%{transform:translateY(0);}
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  input,textarea{font:inherit;color:var(--ivory);background:var(--bg-soft);
    border:1px solid var(--line);border-radius:6px;padding:9px 12px;outline:none;
    transition:border-color .25s;}
  input:focus,textarea:focus{border-color:var(--amber);}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px;}
  .mono{font-family:var(--mono);}
  .view{display:none;position:relative;z-index:1;}
  .view.on{display:block;}

  /* ============ 登录 ============ */
  #login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px;}
  #login.on{display:flex;}
  .door{
    width:min(420px,92vw);text-align:center;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:52px 36px 40px;position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .door .bulb{
    width:14px;height:22px;margin:0 auto 6px;border-radius:7px;
    background:linear-gradient(180deg,#6b5638,#4a3a24);
    box-shadow:0 0 0 rgba(212,85,59,0);transition:all .8s ease;
  }
  .door.lit .bulb{background:linear-gradient(180deg,#F0A56B,#D4553B);
    box-shadow:0 0 26px rgba(212,85,59,.8);}
  .door .cordline{width:1.5px;height:34px;background:var(--line);margin:0 auto 26px;}
  .door h1{font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.18em;}
  .door h1 em{font-style:normal;color:var(--safelight);}
  .door p.sub{margin-top:8px;color:var(--muted);font-size:13px;}
  .door form{margin-top:30px;display:flex;flex-direction:column;gap:14px;}
  .door input{text-align:center;font-family:var(--mono);letter-spacing:.15em;}
  .door input.err{border-color:var(--safelight);animation:shake .4s;}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--amber);color:#241B0E;font-weight:500;
    border-radius:8px;padding:10px 18px;transition:filter .2s,transform .1s;
  }
  .btn:hover{filter:brightness(1.08);} .btn:active{transform:translateY(1px);}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn.ghost:hover{color:var(--ivory);border-color:var(--muted);}
  .btn.danger{background:transparent;color:var(--safelight);border:1px solid rgba(212,85,59,.4);}
  .btn.danger:hover{background:rgba(212,85,59,.12);}
  .door .hint{margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em;}

  /* ============ 工作台框架 ============ */
  #app{min-height:100vh;}
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;gap:18px;
    padding:14px 22px;background:rgba(22,19,16,.86);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
  }
  .brand{font-family:var(--serif);font-weight:900;font-size:19px;letter-spacing:.14em;white-space:nowrap;}
  .brand em{font-style:normal;color:var(--safelight);}
  .brand small{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--faint);
    letter-spacing:.28em;margin-left:10px;}
  .topstats{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.1em;}
  .topstats b{color:var(--muted);font-weight:400;}
  .topbar .sp{flex:1;}
  .icon-btn{
    display:inline-flex;align-items:center;gap:7px;color:var(--muted);
    font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;
    white-space:nowrap;flex:none;
    transition:color .25s,border-color .25s;
  }
  .icon-btn:hover{color:var(--amber);border-color:var(--amber);}
  .icon-btn .badge{
    font-family:var(--mono);font-size:10px;background:var(--safelight);color:#fff;
    border-radius:8px;padding:0 6px;line-height:16px;
  }

  .layout{display:grid;grid-template-columns:300px 1fr;gap:0;max-width:1240px;margin:0 auto;}

  /* ---------- 左栏：节点列表 ---------- */
  .side{
    border-right:1px solid var(--hairline);min-height:calc(100vh - 57px);
    padding:20px 16px 40px;
  }
  .side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .side-head h2{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.24em;}
  /* 节点搜索 */
  .side-search{position:relative;margin-bottom:12px;}
  .side-search input{
    width:100%;font-size:13px;padding:8px 30px 8px 30px;border-radius:9px;
  }
  .side-search .ic{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    font-size:12px;color:var(--faint);pointer-events:none;
  }
  .side-search .clr{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:5px;display:none;place-items:center;
    color:var(--faint);font-size:13px;
  }
  .side-search .clr:hover{color:var(--ivory);}
  .side-search.has .clr{display:grid;}
  .side-hit{font-family:var(--mono);font-size:10.5px;color:var(--faint);
    letter-spacing:.1em;margin:0 4px 8px;}
  .nodes{display:flex;flex-direction:column;gap:6px;}
  .n-item{
    text-align:left;width:100%;padding:12px 14px;border-radius:10px;
    border:1px solid transparent;position:relative;
    transition:background .2s,border-color .2s;
  }
  .n-item:hover{background:var(--bg-soft);}
  .n-item.sel{background:var(--bg-soft);border-color:var(--line);}
  .n-item.sel::before{
    content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:2px;
    background:var(--safelight);border-radius:1px;box-shadow:0 0 8px rgba(212,85,59,.6);
  }
  .n-item .d{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em;}
  .n-item .t{font-family:var(--serif);font-weight:600;font-size:15.5px;letter-spacing:.04em;
    margin-top:1px;display:flex;align-items:center;gap:8px;}
  .n-item .c{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto;}
  .yearsep{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.2em;
    margin:12px 6px 4px;display:flex;align-items:center;gap:10px;}
  .yearsep::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ---------- 右栏：节点详情 ---------- */
  .detail{padding:26px 30px 80px;min-width:0;}
  .d-empty{color:var(--faint);font-family:var(--mono);font-size:12px;letter-spacing:.15em;
    padding:80px 0;text-align:center;}
  .backbtn{display:none;margin-bottom:14px;}
  .d-form{display:grid;grid-template-columns:150px 1fr;gap:12px;max-width:640px;}
  .d-form textarea{grid-column:1/-1;resize:vertical;min-height:60px;}
  .d-form .row2{grid-column:1/-1;display:flex;gap:10px;align-items:center;}
  .savemark{font-family:var(--mono);font-size:11px;color:var(--ok);opacity:0;transition:opacity .4s;}
  .savemark.show{opacity:1;}

  .sect{margin-top:34px;}
  .sect>h3{
    font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.24em;
    display:flex;align-items:center;gap:12px;margin-bottom:16px;
  }
  .sect>h3::after{content:"";flex:1;height:1px;background:var(--line);}

  /* 显影盘（上传区） */
  .tray{
    position:relative;border:1.5px dashed var(--line);border-radius:14px;
    background:linear-gradient(180deg,rgba(212,85,59,.04),rgba(212,85,59,.015));
    padding:34px 20px;text-align:center;color:var(--muted);
    transition:border-color .25s,background .25s;
  }
  .tray.hover{border-color:var(--safelight);background:rgba(212,85,59,.09);color:var(--ivory);}
  .tray .big{font-family:var(--serif);font-size:17px;letter-spacing:.06em;color:var(--ivory);}
  .tray .small{font-size:12.5px;margin-top:4px;}
  .tray .small b{color:var(--amber);font-weight:500;}
  .tray input{display:none;}

  /* 照片网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:18px;margin-top:18px;}
  .card{
    position:relative;background:var(--print);border-radius:3px;
    padding:8px 8px 0;box-shadow:0 3px 6px rgba(0,0,0,.45),0 12px 28px rgba(0,0,0,.3);
    transition:transform .25s ease,box-shadow .25s ease,opacity .3s;
  }
  .card.dragging{opacity:.35;}
  .card.dropTarget::before{
    content:"";position:absolute;left:-11px;top:6px;bottom:6px;width:3px;
    background:var(--amber);border-radius:2px;box-shadow:0 0 8px rgba(217,160,91,.7);
  }
  .card .ph{
    position:relative;height:128px;border-radius:2px;overflow:hidden;background:var(--paper-raw);
  }
  .card .ph .img{
    position:absolute;inset:0;background-size:cover;background-position:center;
    opacity:0;filter:contrast(.35) brightness(1.5) sepia(.5) blur(4px);
    transition:opacity 1s ease,filter 1.4s ease;
  }
  .card .ph .img.dev{opacity:1;filter:none;}
  .card .ph::after{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:var(--grain);opacity:.14;mix-blend-mode:overlay;}
  .card .cap{
    height:40px;display:flex;align-items:center;gap:6px;padding:0 2px;
    font-size:11.5px;color:var(--print-ink);
  }
  .card .cap i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--print-sub);flex:none;}
  .card .cap b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .card .cap input{
    flex:1;min-width:0;background:#fff;border:1px solid var(--amber);
    color:var(--print-ink);font-size:11.5px;padding:3px 6px;border-radius:3px;
  }
  /* 封面星标 */
  .card .star{position:absolute;top:12px;left:12px;z-index:3;font-size:12px;
    color:#F4C86A;text-shadow:0 1px 3px rgba(0,0,0,.6);display:none;}
  .card.cover .star{display:block;}
  /* 悬浮操作 */
  .card .ops{
    position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:6px;
    opacity:0;transition:opacity .2s;
  }
  .card:hover .ops,.card:focus-within .ops{opacity:1;}
  .ops button{
    width:26px;height:26px;border-radius:6px;font-size:12px;
    background:rgba(22,19,16,.72);color:var(--ivory);
    display:grid;place-items:center;
  }
  .ops button:hover{background:var(--safelight);}
  /* 多选：勾选框压在画面左下角，避开左上的封面星标与右上的操作按钮 */
  .card .pick-box{
    position:absolute;left:10px;bottom:48px;z-index:3;
    width:22px;height:22px;border-radius:6px;
    display:grid;place-items:center;
    background:rgba(22,19,16,.66);border:1.5px solid rgba(237,229,216,.5);
    color:transparent;font-size:13px;line-height:1;
    opacity:0;transition:opacity .2s,background .2s,border-color .2s;
  }
  .card:hover .pick-box,.card:focus-within .pick-box{opacity:1;}
  body.picking .card .pick-box{opacity:1;}      /* 已有选中时全部常显 */
  .card.picked .pick-box{
    opacity:1;background:var(--amber);border-color:var(--amber);color:#241B0E;
  }
  .card.picked{outline:2px solid var(--amber);outline-offset:2px;}
  .card.picked .ph{filter:brightness(.82);}
  @media (max-width:760px){ .card .pick-box{opacity:1;} }

  /* 批量操作工具条 */
  #bulkbar{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:94;
    display:none;align-items:center;gap:14px;
    background:rgba(29,25,21,.97);border:1px solid var(--line);
    padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);
    animation:tIn .25s ease;max-width:calc(100vw - 32px);flex-wrap:wrap;
  }
  #bulkbar.on{display:flex;}
  #bulkbar .n{font-family:var(--mono);font-size:12px;color:var(--ivory);
    letter-spacing:.06em;white-space:nowrap;}
  #bulkbar .n b{color:var(--amber);font-weight:400;}
  #bulkbar button{
    font-size:12.5px;padding:6px 12px;border-radius:7px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap;
    transition:color .2s,border-color .2s,background .2s;
  }
  #bulkbar button:hover{color:var(--amber);border-color:var(--amber);}
  #bulkbar button.danger:hover{color:#fff;background:var(--safelight);border-color:var(--safelight);}
  body.light #bulkbar{background:rgba(255,253,246,.98);box-shadow:0 8px 24px rgba(90,75,55,.25);}

  /* 拖拽把手（木夹） */
  .handle{
    position:absolute;top:-11px;left:50%;transform:translateX(-50%);z-index:3;
    width:14px;height:24px;border-radius:3px;cursor:grab;touch-action:none;
    background:linear-gradient(180deg,#C79E63,#8A6739 70%,#6E5230);
    box-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  .handle:active{cursor:grabbing;}
  .handle::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:1.5px;
    transform:translateX(-50%);background:rgba(60,42,20,.55);}

  /* 上传中 / 失败态 */
  .card .prog{
    position:absolute;left:8px;right:8px;bottom:44px;height:3px;z-index:2;
    background:rgba(0,0,0,.18);border-radius:2px;overflow:hidden;display:none;
  }
  .card.uploading .prog{display:block;}
  .card .prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s;}
  .card .statebadge{
    position:absolute;inset:8px 8px 48px;z-index:2;display:none;
    align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:#B4543E;
    border:1px dashed rgba(180,84,62,.55);transform:rotate(-6deg);
  }
  .card.failed .statebadge{display:flex;}
  .card.failed .retry{
    position:absolute;bottom:48px;left:50%;transform:translateX(-50%);z-index:3;
    font-size:11px;padding:3px 10px;border-radius:6px;
    background:rgba(212,85,59,.9);color:#fff;
  }
  .card .retry{display:none;} .card.failed .retry{display:block;}

  /* ============ 回收站 ============ */
  .trashlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:26px 30px;}
  .t-item{
    background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:16px;
  }
  .t-item .ty{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.2em;}
  .t-item .nm{font-family:var(--serif);font-weight:600;margin-top:4px;font-size:15px;}
  .t-item .cd{font-family:var(--mono);font-size:11px;color:var(--safelight);margin-top:6px;}
  .t-item .row{margin-top:12px;display:flex;gap:8px;}
  .t-empty{grid-column:1/-1;text-align:center;color:var(--faint);
    font-family:var(--mono);font-size:12px;letter-spacing:.15em;padding:60px 0;}

  /* ============ 弹层 / Toast ============ */
  .modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
    background:rgba(14,12,10,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:24px;}
  .modal.on{display:flex;}
  .modal .box{
    width:min(400px,92vw);background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:26px;box-shadow:0 30px 70px rgba(0,0,0,.5);
  }
  .modal h4{font-family:var(--serif);font-size:17px;letter-spacing:.04em;}
  .modal p{margin-top:8px;color:var(--muted);font-size:13.5px;}
  .modal .row{margin-top:20px;display:flex;justify-content:flex-end;gap:10px;}

  /* 节点选择器（移动照片到其他节点） */
  .picklist{
    margin-top:16px;max-height:min(46vh,340px);overflow-y:auto;
    display:flex;flex-direction:column;gap:4px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .picklist::-webkit-scrollbar{width:6px;}
  .picklist::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .pick{
    text-align:left;width:100%;padding:9px 12px;border-radius:8px;
    border:1px solid transparent;display:flex;align-items:baseline;gap:10px;
    transition:background .2s,border-color .2s;
  }
  .pick:hover{background:var(--bg-soft);border-color:var(--line);}
  .pick .d{font-family:var(--mono);font-size:10.5px;color:var(--amber);flex:none;}
  .pick .t{font-family:var(--serif);font-weight:600;font-size:14.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pick .c{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto;flex:none;}
  .pick-empty{color:var(--faint);font-family:var(--mono);font-size:12px;
    letter-spacing:.1em;text-align:center;padding:28px 0;}
  #toasts{position:fixed;left:0;right:0;bottom:26px;z-index:95;
    display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
  .toast{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    background:rgba(29,25,21,.94);border:1px solid var(--line);color:var(--ivory);
    padding:9px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:tIn .3s ease;
  }
  .toast.ok{border-color:rgba(127,166,90,.5);} .toast.err{border-color:rgba(212,85,59,.6);}
  @keyframes tIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;}}

  /* 批量上传总进度（显影盘一次吞下整个文件夹时） */
  #batchbar{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:96;
    display:flex;flex-direction:column;gap:8px;min-width:min(300px,86vw);
    font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
    background:rgba(29,25,21,.96);border:1px solid var(--line);color:var(--ivory);
    padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);
    animation:tIn .3s ease;
  }
  #batchbar[hidden]{display:none;}
  #batchbar .row{display:flex;align-items:baseline;gap:10px;}
  #batchbar .row span{flex:1;}
  #batchbar .row em{font-style:normal;color:var(--faint);}
  #batchbar .bar{display:block;height:3px;background:rgba(255,255,255,.12);
    border-radius:2px;overflow:hidden;}
  #batchbar .bar b{display:block;height:100%;width:0;background:var(--amber);
    transition:width .3s ease;}
  body.light #batchbar{background:rgba(255,253,246,.97);
    box-shadow:0 8px 24px rgba(90,75,55,.25);}
  body.light #batchbar .bar{background:rgba(90,75,55,.14);}

  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
    .topbar{gap:8px;padding:12px 14px;}
    .brand{font-size:17px;}
    .brand small{display:none;}
    .icon-btn{padding:7px 10px;font-size:12.5px;}
    .icon-btn .tx{display:none;}       /* 手机端只留图标，防止顶栏换行 */
    #logoutBtn .tx{display:inline;}    /* 退出保留文字，避免误触 */
    .side{border-right:none;min-height:0;padding-bottom:8px;}
    .detail{padding:18px 18px 80px;}
    .layout.showDetail .side{display:none;}
    .layout:not(.showDetail) .detail{display:none;}
    .backbtn{display:inline-flex;}
    .d-form{grid-template-columns:1fr;}
    .topstats{display:none;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;}
    .card .ops{opacity:1;}     /* 触屏无 hover，常显 */
  }
</style>
</head>
<body>

<button class="cord" id="cord" aria-label="拉灯：切换亮/暗主题" aria-pressed="false" title="拉一下开灯 / 关灯">
  <span class="cord-line" aria-hidden="true"></span>
  <span class="cord-knob" aria-hidden="true"></span>
</button>

<!-- ================= 登录 ================= -->
<div class="view on" id="login">
  <div class="door" id="door">
    <div class="cordline"></div><div class="bulb" id="bulb"></div>
    <h1>拾光<em>·</em>集</h1>
    <p class="sub">暗房工作台 · 请出示管理口令</p>
    <form id="loginForm">
      <input type="password" id="token" placeholder="ADMIN TOKEN" autocomplete="current-password">
      <button class="btn" type="submit">拉灯 · 进入暗房</button>
    </form>
    <p class="hint">口令即部署时设置的 SG_ADMIN_TOKEN</p>
  </div>
</div>

<!-- ================= 工作台 ================= -->
<div class="view" id="app">
  <div class="topbar">
    <span class="brand">拾光<em>·</em>集<small>DARKROOM CONSOLE</small></span>
    <span class="topstats" id="stats"></span>
    <span class="sp"></span>
    <button class="icon-btn" id="themeBtn"><span class="ic">🔆</span><span class="tx">开灯</span></button>
    <button class="icon-btn" id="trashBtn">🗑 <span class="tx">回收站</span> <span class="badge" id="trashCount" hidden>0</span></button>
    <button class="icon-btn" id="logoutBtn">⏻ <span class="tx">锁门退出</span></button>
  </div>

  <!-- 主视图：列表 + 详情 -->
  <div class="layout" id="mainView">
    <aside class="side">
      <div class="side-head">
        <h2>时间轴节点</h2>
        <button class="btn" id="newNode" style="padding:6px 12px;font-size:13px">＋ 新建</button>
      </div>
      <div class="side-search" id="sideSearch">
        <span class="ic" aria-hidden="true">🔍</span>
        <input type="search" id="nodeSearch" placeholder="搜标题或日期…"
               autocomplete="off" aria-label="搜索节点">
        <button class="clr" id="nodeSearchClr" aria-label="清除搜索">✕</button>
      </div>
      <div class="side-hit" id="sideHit" hidden></div>
      <div class="nodes" id="nodeList"></div>
    </aside>

    <main class="detail" id="detail"></main>
  </div>

  <!-- 回收站视图 -->
  <div id="trashView" style="display:none">
    <div style="padding:22px 30px 0;display:flex;align-items:center;gap:14px">
      <button class="icon-btn" id="trashBack">← 返回</button>
      <h3 style="font-family:var(--serif);letter-spacing:.06em">回收站</h3>
      <span class="mono" style="font-size:11px;color:var(--faint)">物品保留 7 天，到期自动清除</span>
    </div>
    <div class="trashlist" id="trashList"></div>
  </div>
</div>

<!-- 确认弹层 -->
<div class="modal" id="modal">
  <div class="box">
    <h4 id="mTitle"></h4><p id="mBody"></p>
    <div class="row">
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mOk">确认</button>
    </div>
  </div>
</div>

<!-- 节点选择弹层（移动照片） -->
<div class="modal" id="pickModal">
  <div class="box">
    <h4>移到哪个节点？</h4>
    <p id="pickBody"></p>
    <div class="picklist" id="pickList"></div>
    <div class="row">
      <button class="btn ghost" id="pickCancel">取消</button>
    </div>
  </div>
</div>
<div id="toasts"></div>
<div id="bulkbar">
  <span class="n">已选 <b id="bulkN">0</b> 张</span>
  <button id="bulkAll">全选</button>
  <button id="bulkNone">取消选择</button>
  <button id="bulkMove">⇄ 移到其他节点</button>
  <button class="danger" id="bulkDel">✕ 批量删除</button>
</div>
<div id="batchbar" hidden>
  <div class="row"><span id="batchText"></span><em id="batchSub"></em></div>
  <i class="bar"><b id="batchFill"></b></i>
</div>

<script>
/* ================= API 层 ================= */
const API = '/api/v1';
const token = () => sessionStorage.getItem('sg_token') || '';

/* api：统一带 Bearer、统一 401 拦截弹回登录、错误抛 {status,data} */
async function api(path, opt = {}){
  const headers = Object.assign({'Authorization': 'Bearer ' + token()}, opt.headers || {});
  let body = opt.body;
  if(body && !(body instanceof FormData) && typeof body !== 'string'){
    body = JSON.stringify(body);
    headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(API + path, Object.assign({}, opt, {headers, body}));
  if(res.status === 401 && document.body.classList.contains('in-app')){
    logout();
    toast('登录已失效，请重新出示口令', 'err');
  }
  if(res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw {status: res.status, data, retryAfter: res.headers.get('Retry-After')};
  return data;
}

/* XHR 上传：upload.onprogress 驱动原型进度条 */
function xhrUpload(method, url, body, onProgress, headers = {}){
  return new Promise((res, rej) => {
    const xhr = new XMLHttpRequest();
    xhr.open(method, url);
    for(const [k, v] of Object.entries(headers)) xhr.setRequestHeader(k, v);
    xhr.upload.onprogress = e => { if(e.lengthComputable) onProgress(e.loaded / e.total * 100); };
    xhr.onload = () => {
      let data = {};
      try{ data = JSON.parse(xhr.responseText || '{}'); }catch(_){}
      if(xhr.status >= 200 && xhr.status < 300) res(data);
      else rej({status: xhr.status, data,
                retryAfter: xhr.getResponseHeader('Retry-After')});
    };
    xhr.onerror = () => rej({status: 0, data: {message: '网络错误'}});
    xhr.send(body);
  });
}

/* ================= 状态 ================= */
const state = {
  nodes: [],    // {id,date,title,desc,photos:[{id,cap,st,fail,bg,variants,prog,_file}]}
  trash: [],    // GET /trash items
  sel: null,
  mode: 'local' // 由 GET /stats 的 upload_mode 决定上传路径
};

function mapPhoto(p){
  return {
    id: p.id, cap: p.caption, st: p.status, fail: p.fail_reason,
    variants: p.variants || {},
    bg: p.variants && p.variants.thumb ? `url('${p.variants.thumb}')` : ''
  };
}
function mapNode(n){
  return {id: n.id, date: n.date, title: n.title, desc: n.description,
          photo_count: n.photo_count || 0,
          photos: (n.photos || []).map(mapPhoto),
          _loaded: Array.isArray(n.photos)};
}

/* 管理端只拉节点元数据（include_photos=false）：登录时不把整库照片带下来。
   某个节点的照片等选中它时再按需取。 */
async function loadAll(){
  const nodes = [];
  let cursor = null;
  do{
    const q = '/timeline?limit=50&include_photos=false'
      + (cursor ? `&cursor=${encodeURIComponent(cursor)}` : '');
    const d = await api(q);
    d.items.forEach(n => {
      const mapped = mapNode(n);
      mapped._loaded = false;            // 只有元数据，照片还没取
      mapped.photos = [];
      nodes.push(mapped);
    });
    cursor = d.next_cursor;
  }while(cursor);
  state.nodes = nodes;
  state.trash = (await api('/trash')).items;
}

/* 按需取某个节点的照片；已取过则直接返回 */
async function ensurePhotos(n){
  if(!n || n._loaded) return n;
  const d = await api(`/nodes/${n.id}`);
  n.photos = (d.photos || []).map(mapPhoto);
  n.photo_count = d.photo_count;
  n._loaded = true;
  n.photos.forEach(p => watch(p, n));     /* 仍在显影的接着轮询 */
  return n;
}

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssq = s => (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\]/g, '\\$&');
function toast(msg, cls = ''){
  const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = 0; t.style.transition = 'opacity .4s';
    setTimeout(() => t.remove(), 400); }, 2400);
}
function errMsg(err, fallback){
  return (err && err.data && err.data.message) ? err.data.message : fallback;
}
function confirmBox(title, body){
  return new Promise(res => {
    $('#mTitle').textContent = title; $('#mBody').textContent = body;
    $('#modal').classList.add('on');
    const done = v => { $('#modal').classList.remove('on'); ok.onclick = cc.onclick = null; res(v); };
    const ok = $('#mOk'), cc = $('#mCancel');
    ok.onclick = () => done(true); cc.onclick = () => done(false);
  });
}

/* 节点选择器：列出除 excludeId 外的全部节点，返回选中的 id 或 null */
function pickNode(excludeId, hint){
  return new Promise(res => {
    const list = $('#pickList');
    $('#pickBody').textContent = hint || '';
    const items = [...state.nodes]
      .filter(n => n.id !== excludeId)
      .sort((a, b) => b.date.localeCompare(a.date));
    if(!items.length){
      list.innerHTML = '<div class="pick-empty">没有其他节点可移动</div>';
    }else{
      list.innerHTML = items.map(n => `
        <button class="pick" data-id="${esc(n.id)}">
          <span class="d">${esc(n.date)}</span>
          <span class="t">${esc(n.title)}</span>
          <span class="c">×${n.photo_count}</span>
        </button>`).join('');
    }
    $('#pickModal').classList.add('on');
    const done = v => {
      $('#pickModal').classList.remove('on');
      list.onclick = null; $('#pickCancel').onclick = null;
      document.removeEventListener('keydown', onKey);
      res(v);
    };
    const onKey = e => { if(e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onKey);
    list.onclick = e => {
      const b = e.target.closest('.pick');
      if(b) done(b.dataset.id);
    };
    $('#pickCancel').onclick = () => done(null);
  });
}
const node = id => state.nodes.find(n => n.id === id);

/* ================= 主题切换（与前台共用 localStorage 键 sg_theme） ================= */
const cord = $('#cord'), themeBtn = $('#themeBtn');
if(localStorage.getItem('sg_theme') === 'light') document.body.classList.add('light');
function syncThemeBtn(){
  const light = document.body.classList.contains('light');
  themeBtn.querySelector('.ic').textContent = light ? '🌙' : '🔆';
  themeBtn.querySelector('.tx').textContent = light ? '关灯' : '开灯';
  themeBtn.setAttribute('aria-pressed', light);
  cord.setAttribute('aria-pressed', light);
}
function toggleTheme(){
  const light = document.body.classList.toggle('light');
  localStorage.setItem('sg_theme', light ? 'light' : 'dark');
  cord.classList.remove('pulled'); void cord.offsetWidth; cord.classList.add('pulled');
  syncThemeBtn();
  toast(light ? '已开灯 · 亮色相纸间' : '已关灯 · 回到暗房', 'ok');
}
cord.addEventListener('click', toggleTheme);
themeBtn.addEventListener('click', toggleTheme);
syncThemeBtn();

/* ================= 登录：GET /stats 带 Bearer 验证口令 ================= */
async function enterApp(){
  const stats = await api('/stats');      // 401 会被 throw
  state.mode = stats.upload_mode || 'local';
  await loadAll();
  $('#login').classList.remove('on'); $('#app').classList.add('on');
  document.body.classList.add('in-app');
  state.sel = state.nodes[0]?.id || null;
  renderAll();
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('#token').value.trim();
  if(!v){
    $('#token').classList.add('err'); toast('请输入口令', 'err');
    setTimeout(() => $('#token').classList.remove('err'), 450);
    return;
  }
  sessionStorage.setItem('sg_token', v);
  try{
    $('#door').classList.add('lit');
    await new Promise(r => setTimeout(r, 300));   // 灯先亮一下
    await enterApp();
  }catch(err){
    sessionStorage.removeItem('sg_token');
    $('#door').classList.remove('lit');
    $('#token').classList.add('err');
    toast(err.status === 401 ? '口令无效' : errMsg(err, '连接失败，请稍后重试'), 'err');
    setTimeout(() => $('#token').classList.remove('err'), 450);
  }
});
function logout(){
  sessionStorage.removeItem('sg_token');
  $('#app').classList.remove('on'); $('#login').classList.add('on');
  document.body.classList.remove('in-app');
  $('#door').classList.remove('lit'); $('#token').value = '';
}
$('#logoutBtn').addEventListener('click', logout);
/* 已有会话（刷新页面）自动进入 */
if(token()){ enterApp().catch(() => sessionStorage.removeItem('sg_token')); }

/* ================= 渲染 ================= */
function renderAll(){ renderList(); renderDetail(); renderStats(); renderTrashBadge(); }
function renderStats(){
  const p = state.nodes.reduce((a, n) => a + (n.photo_count || 0), 0);
  const el = $('#stats');
  el.textContent = '';
  const b1 = document.createElement('b'); b1.textContent = state.nodes.length;
  const b2 = document.createElement('b'); b2.textContent = p;
  el.append(b1, ' 节点 · ', b2, ' 相纸');
}
function renderTrashBadge(){
  const el = $('#trashCount');
  el.hidden = !state.trash.length;
  el.textContent = state.trash.length;
}
/* 节点搜索：标题或日期任一命中即可；空格分隔的多个词需全部命中 */
let nodeQuery = '';
function matchNode(n, terms){
  if(!terms.length) return true;
  const hay = (n.title + ' ' + n.date).toLowerCase();
  return terms.every(t => hay.includes(t));
}

function renderList(){
  const terms = nodeQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const sorted = [...state.nodes]
    .filter(n => matchNode(n, terms))
    .sort((a, b) => b.date.localeCompare(a.date));

  const hit = $('#sideHit');
  if(terms.length){
    hit.hidden = false;
    hit.textContent = `${sorted.length} / ${state.nodes.length} 个节点`;
  }else{
    hit.hidden = true;
  }
  $('#sideSearch').classList.toggle('has', nodeQuery !== '');

  let html = '', year = '';
  sorted.forEach(n => {
    const y = n.date.slice(0, 4);
    if(y !== year){ year = y; html += `<div class="yearsep">${esc(y)}</div>`; }
    html += `<button class="n-item ${n.id === state.sel ? 'sel' : ''}" data-id="${esc(n.id)}">
      <span class="d">${esc(n.date)}</span>
      <span class="t">${esc(n.title)}<span class="c">×${n.photo_count}</span></span>
    </button>`;
  });
  $('#nodeList').innerHTML = html ||
    (terms.length ? '<div class="t-empty">没有匹配的节点</div>'
                  : '<div class="t-empty">还没有节点</div>');
}

$('#nodeSearch').addEventListener('input', e => {
  nodeQuery = e.target.value;
  renderList();
});
$('#nodeSearchClr').addEventListener('click', () => {
  nodeQuery = ''; $('#nodeSearch').value = ''; renderList(); $('#nodeSearch').focus();
});
$('#nodeList').addEventListener('click', e => {
  const b = e.target.closest('.n-item'); if(!b) return;
  state.sel = b.dataset.id;
  clearSel();                                       /* 换节点即清空选择 */
  renderList(); renderDetail();
  $('#mainView').classList.add('showDetail');       /* 手机端切详情视图 */
});

function renderDetail(){
  const n = node(state.sel);
  const d = $('#detail');
  if(!n){ d.innerHTML = '<div class="d-empty">← 选择或新建一个节点</div>'; return; }
  d.innerHTML = `
    <button class="icon-btn backbtn" id="backList">← 节点列表</button>
    <div class="d-form">
      <input type="date" id="fDate" value="${esc(n.date)}">
      <input type="text" id="fTitle" maxlength="120" value="${esc(n.title)}" placeholder="标题">
      <textarea id="fDesc" maxlength="2000" placeholder="描述">${esc(n.desc)}</textarea>
      <div class="row2">
        <button class="btn" id="saveNode">保存节点</button>
        <span class="savemark" id="saved">✓ 已保存</span>
        <span style="flex:1"></span>
        <button class="btn danger" id="delNode">移入回收站</button>
      </div>
    </div>

    <div class="sect">
      <h3>显影盘 · 上传</h3>
      <label class="tray" id="tray">
        <div class="big">把照片或整个文件夹拖进显影盘</div>
        <div class="small">或 <b>点击选择</b> · jpg / png / webp · 单张 ≤ 30MB</div>
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple>
      </label>
      <p class="mono" style="margin-top:10px;font-size:11px;color:var(--faint);letter-spacing:.06em">
        整批老照片建议用 <b style="color:var(--amber);font-weight:400">sgctl import</b>
        命令行工具，可自动按拍摄日期分节点、断点续传
      </p>
    </div>

    <div class="sect">
      <h3>晾片整理 · 拖木夹排序 / ✎ 改注 / ★ 设封面 / ⇄ 移到其他节点 / ✓ 多选</h3>
      <div class="grid" id="grid"></div>
      <div class="d-empty" id="gridLoading" hidden>正在取出相纸……</div>
    </div>`;
  if(n._loaded){
    renderGrid(n);
  }else{
    /* 照片按需加载：先把外壳渲染出来，拿到再补上网格 */
    $('#gridLoading').hidden = false;
    ensurePhotos(n).then(() => {
      if(state.sel !== n.id) return;          // 用户已经切走了
      $('#gridLoading')?.setAttribute('hidden', '');
      renderGrid(n); renderList(); renderStats();
    }).catch(err => {
      $('#gridLoading')?.setAttribute('hidden', '');
      toast(errMsg(err, '照片加载失败'), 'err');
    });
  }

  $('#backList').onclick = () => $('#mainView').classList.remove('showDetail');
  $('#saveNode').onclick = async () => {
    const t = $('#fTitle').value.trim();
    if(!t){ toast('标题不能为空', 'err'); return; }
    try{
      const upd = await api(`/nodes/${n.id}`, {method: 'PATCH',
        body: {date: $('#fDate').value || n.date, title: t, description: $('#fDesc').value}});
      n.date = upd.date; n.title = upd.title; n.desc = upd.description;
      renderList(); renderStats();
      $('#saved').classList.add('show');
      setTimeout(() => $('#saved')?.classList.remove('show'), 1600);
    }catch(err){
      toast(errMsg(err, '保存失败'), 'err');
    }
  };
  $('#delNode').onclick = async () => {
    if(await confirmBox('移入回收站？',
        `节点「${n.title}」及其 ${n.photo_count} 张照片将进入回收站，7 天内可恢复。`)){
      try{
        await api(`/nodes/${n.id}`, {method: 'DELETE'});
        state.nodes = state.nodes.filter(x => x.id !== n.id);
        state.sel = state.nodes[0]?.id || null;
        state.trash = (await api('/trash')).items;
        renderAll(); toast('已移入回收站', 'ok');
      }catch(err){
        toast(errMsg(err, '删除失败'), 'err');
      }
    }
  };
  /* 显影盘 */
  const tray = $('#tray');
  ;['dragenter','dragover'].forEach(ev => tray.addEventListener(ev, e => { e.preventDefault(); tray.classList.add('hover'); }));
  ;['dragleave','drop'].forEach(ev => tray.addEventListener(ev, e => { e.preventDefault(); tray.classList.remove('hover'); }));
  tray.addEventListener('drop', async e => {
    const files = await filesFromDrop(e.dataTransfer);
    ingest(n, files);
  });
  $('#file').addEventListener('change', e => { ingest(n, [...e.target.files]); e.target.value = ''; });
}

/* 拖入的若是文件夹，递归展开成文件列表（DataTransferItem.webkitGetAsEntry）；
   浏览器不支持时退回 dataTransfer.files（只含顶层文件）。 */
async function filesFromDrop(dt){
  const entries = [...(dt.items || [])]
    .map(it => it.webkitGetAsEntry && it.webkitGetAsEntry())
    .filter(Boolean);
  if(!entries.length) return [...dt.files];

  const out = [];
  const walk = entry => new Promise(res => {
    if(entry.isFile){
      entry.file(f => { out.push(f); res(); }, res);
      return;
    }
    if(!entry.isDirectory){ res(); return; }
    const reader = entry.createReader();
    const readBatch = () => reader.readEntries(async batch => {
      if(!batch.length){ res(); return; }        /* 目录读完 */
      await Promise.all(batch.map(walk));
      readBatch();                               /* readEntries 每次最多 100 条 */
    }, res);
    readBatch();
  });
  await Promise.all(entries.map(walk));
  return out;
}

/* ================= 上传（local: multipart / s3: presign→PUT→confirm） =================
   批量上传走并发队列：一次拖进几十上百张时，既不打爆服务端限流，
   也不让浏览器同时挂起上百个 XHR。429 一律指数退避重试而非判失败。 */
const UPLOAD_CONCURRENCY = 3;
const MAX_MB = 30;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const tmpId = () => 'tmp-' + Date.now() + '-' + Math.random().toString(36).slice(2);

const batch = {total: 0, done: 0, ok: 0, dup: 0, failed: 0, active: 0, queue: []};

/* renderGrid 是整表重建，批量时用 rAF 合并，避免每张完成都重排一次 DOM */
let gridPending = null;
function scheduleGrid(n){
  if(gridPending) return;
  gridPending = requestAnimationFrame(() => {
    gridPending = null;
    if(state.sel === n.id) renderGrid(n);
    renderList(); renderStats();
  });
}

/* 429 指数退避：优先尊重 Retry-After，最多重试 5 次 */
async function withBackoff(fn, attempts = 5){
  for(let i = 0; ; i++){
    try{ return await fn(); }
    catch(err){
      if(err.status !== 429 || i >= attempts - 1) throw err;
      const ra = Number(err.retryAfter) || 0;
      await sleep(ra > 0 ? ra * 1000 + Math.random() * 500
                         : Math.min(30000, 1000 * 2 ** i) + Math.random() * 500);
    }
  }
}

function ingest(n, files){
  const imgs = [];
  let wrongType = 0, tooBig = 0;
  for(const f of files){
    if(!/image\/(jpeg|png|webp)/.test(f.type)){ wrongType++; continue; }
    if(f.size > MAX_MB * 1024 * 1024){ tooBig++; continue; }
    imgs.push(f);
  }
  if(wrongType) toast(`${wrongType} 个文件不是 jpg / png / webp，已跳过`, 'err');
  if(tooBig) toast(`${tooBig} 个文件超过 ${MAX_MB}MB，已跳过`, 'err');
  if(!imgs.length) return;

  /* 先一次性建好占位卡片并渲染一次，再逐个排队上传 */
  const items = imgs.map(f => {
    const p = {id: tmpId(), cap: f.name.replace(/\.[^.]+$/, ''),
               bg: `url('${URL.createObjectURL(f)}')`,
               st: 'queued', prog: 0, _file: f};
    n.photos.push(p);
    return {n, f, p};
  });
  n.photo_count = n.photos.length;
  renderGrid(n); renderList(); renderStats();
  enqueue(items);
}

function enqueue(items){
  batch.total += items.length;
  batch.queue.push(...items);
  showBatch();
  while(batch.active < UPLOAD_CONCURRENCY && batch.queue.length) pump();
}

function pump(){
  const item = batch.queue.shift();
  if(!item) return;
  batch.active++;
  uploadOne(item.n, item.f, item.p).then(r => {
    if(r === 'dup') batch.dup++;
    else if(r === 'failed') batch.failed++;
    else batch.ok++;
  }).finally(() => {
    batch.active--;
    batch.done++;
    showBatch();
    if(batch.queue.length) pump();
    else if(batch.active === 0) endBatch();
  });
}

function showBatch(){
  if(batch.total <= 1) return;           /* 单张走卡片自身进度条即可 */
  const bar = $('#batchbar');
  bar.hidden = false;
  $('#batchText').textContent = `上传中 ${batch.done} / ${batch.total}`;
  const parts = [];
  if(batch.dup) parts.push(`${batch.dup} 张已存在`);
  if(batch.failed) parts.push(`${batch.failed} 张失败`);
  $('#batchSub').textContent = parts.join(' · ');
  $('#batchFill').style.width = (batch.done / batch.total * 100).toFixed(1) + '%';
}

function endBatch(){
  const {total, ok, dup, failed} = batch;
  if(total > 1){
    const parts = [`${ok} 张已进显影盘`];
    if(dup) parts.push(`${dup} 张已存在`);
    if(failed) parts.push(`${failed} 张失败`);
    toast(parts.join(' · '), failed ? 'err' : 'ok');
  }
  setTimeout(() => { $('#batchbar').hidden = true; }, 600);
  batch.total = batch.done = batch.ok = batch.dup = batch.failed = 0;
}

/* uploadOne 只负责传一张，成功/秒传/失败都以返回值告知队列，不再抛出 */
async function uploadOne(n, f, p){
  p.st = 'uploading'; p.prog = 0; p.fail = null;
  scheduleGrid(n);               /* 单张重试时让卡片立刻回到"上传中" */
  const onp = pct => {
    p.prog = pct;
    const el = document.querySelector(`.card[data-id="${cssq(p.id)}"] .prog i`);
    if(el) el.style.width = pct + '%';
  };
  try{
    let ph;
    if(state.mode === 's3'){
      const pre = await withBackoff(() => api('/uploads/presign', {method: 'POST',
        body: {node_id: n.id, filename: f.name, size: f.size, content_type: f.type}}));
      await xhrUpload('PUT', pre.upload_url, f, onp, {'Content-Type': f.type});
      ph = await withBackoff(() => api(`/photos/${pre.photo_id}/confirm`, {method: 'POST'}));
    }else{
      ph = await withBackoff(() => {
        const fd = new FormData();
        fd.append('file', f);
        return xhrUpload('POST', `${API}/nodes/${n.id}/photos`, fd, onp,
          {'Authorization': 'Bearer ' + token()});
      });
    }
    const file = p._file;
    Object.assign(p, mapPhoto(ph));
    p._file = file;
    scheduleGrid(n);
    watch(p, n);                 /* 202 后进入"显影中"，轮询到 ready/failed */
    return 'ok';
  }catch(err){
    if(err.status === 409 && err.data && err.data.photo){
      /* 秒传：换成已存在的那张 */
      n.photos = n.photos.filter(x => x.id !== p.id);
      const exist = mapPhoto(err.data.photo);
      if(!n.photos.some(x => x.id === exist.id)) n.photos.push(exist);
      n.photo_count = n.photos.length;
      if(batch.total <= 1) toast('已存在相同照片', 'ok');
      scheduleGrid(n);
      return 'dup';
    }
    p.st = 'failed'; p.fail = errMsg(err, '上传失败');
    scheduleGrid(n);
    if(batch.total <= 1) toast(errMsg(err, '上传失败，可重试'), 'err');
    return 'failed';
  }
}

/* ================= 显影轮询（3s 直至 ready/failed） =================
   按节点轮询而非按照片：GET /nodes/{id} 一次带回该节点全部照片状态，
   所以一个节点里传 200 张也只是每 3 秒 1 个请求。 */
const watchNodes = new Set();
let pollT = null;
function watch(p, n){
  if(p.st !== 'pending' && p.st !== 'processing') return;
  watchNodes.add(n.id);
  if(!pollT) pollT = setInterval(pollTick, 3000);
}
async function pollTick(){
  for(const nodeId of [...watchNodes]){
    const n = node(nodeId);
    if(!n){ watchNodes.delete(nodeId); continue; }
    try{
      const d = await api(`/nodes/${nodeId}`);
      const fresh = new Map(d.photos.map(x => [x.id, x]));
      let changed = 0, failed = 0, waiting = 0;
      for(const p of n.photos){
        const d2 = fresh.get(p.id);
        if(d2 && d2.status !== p.st){
          const file = p._file;
          Object.assign(p, mapPhoto(d2));
          p._file = file;
          changed++;
          if(p.st === 'failed') failed++;
        }
        if(p.st === 'pending' || p.st === 'processing') waiting++;
      }
      if(!waiting) watchNodes.delete(nodeId);
      if(changed) scheduleGrid(n);
      if(failed) toast(`${failed} 张曝光失败，可重试`, 'err');
    }catch(err){
      if(err.status === 404) watchNodes.delete(nodeId);
    }
  }
  if(!watchNodes.size){ clearInterval(pollT); pollT = null; }
}

/* ================= 卡片操作 + 拖拽排序 ================= */
/* 服务端整组重排：排除仍在本地上传中的临时卡片 */
async function pushOrder(n, prev){
  const ids = n.photos.filter(p => !String(p.id).startsWith('tmp-')).map(p => p.id);
  if(!ids.length) return;
  try{
    await api(`/nodes/${n.id}/photos/order`, {method: 'PUT', body: {photo_ids: ids}});
  }catch(err){
    if(prev){ n.photos = prev; renderGrid(n); }   /* 失败回滚本地顺序 */
    toast(errMsg(err, '排序失败，已还原'), 'err');
    throw err;
  }
}

function bindCards(n){
  const g = $('#grid');
  g.onclick = async e => {
    const btn = e.target.closest('button[data-op]'); if(!btn) return;
    const card = e.target.closest('.card');
    const p = n.photos.find(x => x.id === card.dataset.id);
    if(!p) return;
    const op = btn.dataset.op;
    if(op === 'pick'){
      const cards = [...g.querySelectorAll('.card')];
      const idx = cards.indexOf(card);
      if(e.shiftKey && lastPickIndex >= 0){
        /* Shift 连选：从锚点到当前全部选上 */
        const [a, b] = idx < lastPickIndex ? [idx, lastPickIndex] : [lastPickIndex, idx];
        for(let i = a; i <= b; i++) sel.add(cards[i].dataset.id);
      }else{
        sel.has(p.id) ? sel.delete(p.id) : sel.add(p.id);
        lastPickIndex = idx;
      }
      syncSel();
      return;
    }
    if(op === 'del'){
      if(String(p.id).startsWith('tmp-')){
        n.photos = n.photos.filter(x => x.id !== p.id);
        n.photo_count = n.photos.length;
        renderGrid(n); renderList(); renderStats();
        return;
      }
      if(await confirmBox('删除这张照片？', '将进入回收站，7 天内可恢复。')){
        try{
          await api(`/photos/${p.id}`, {method: 'DELETE'});
          n.photos = n.photos.filter(x => x.id !== p.id);
          n.photo_count = n.photos.length;
          state.trash = (await api('/trash')).items;
          renderGrid(n); renderList(); renderStats(); renderTrashBadge();
          toast('已移入回收站', 'ok');
        }catch(err){
          toast(errMsg(err, '删除失败'), 'err');
        }
      }
    }else if(op === 'move'){
      if(String(p.id).startsWith('tmp-')){
        toast('这张还在上传中，稍后再移', 'err');
        return;
      }
      const target = await pickNode(n.id, `把「${p.cap}」移到：`);
      if(!target) return;
      try{
        await api(`/photos/${p.id}`, {method: 'PATCH', body: {node_id: target}});
        n.photos = n.photos.filter(x => x.id !== p.id);
        n.photo_count = n.photos.length;
        const tn = node(target);
        if(tn){
          if(tn._loaded) tn.photos.push(p);   /* 服务端把它挂到目标节点末尾 */
          tn.photo_count = (tn.photo_count || 0) + 1;
        }
        renderGrid(n); renderList(); renderStats();
        toast(`已移到「${tn ? tn.title : '目标节点'}」`, 'ok');
      }catch(err){
        if(err.status === 409){
          toast('目标节点已有同一张照片', 'err');
        }else{
          toast(errMsg(err, '移动失败'), 'err');
        }
      }
    }else if(op === 'cover'){
      const prev = [...n.photos];
      n.photos = [p, ...n.photos.filter(x => x.id !== p.id)];
      renderGrid(n);
      try{ await pushOrder(n, prev); toast('已设为封面', 'ok'); }catch(_){}
    }else if(op === 'cap'){
      const b = card.querySelector('.cap b');
      const inp = document.createElement('input'); inp.value = p.cap; inp.maxLength = 200;
      b.replaceWith(inp); inp.focus(); inp.select();
      let doneFlag = false;
      const commit = async () => {
        if(doneFlag) return; doneFlag = true;
        const val = inp.value.trim();
        if(!val || val === p.cap){ renderGrid(n); return; }
        try{
          const d = await api(`/photos/${p.id}`, {method: 'PATCH', body: {caption: val}});
          p.cap = d.caption;
        }catch(err){
          toast(errMsg(err, '改注失败'), 'err');
        }
        renderGrid(n);
      };
      inp.addEventListener('keydown', ev => {
        if(ev.key === 'Enter') commit();
        if(ev.key === 'Escape'){ doneFlag = true; renderGrid(n); }
      });
      inp.addEventListener('blur', commit);
    }else if(op === 'retry'){
      if(p._file && (String(p.id).startsWith('tmp-') || !p.id)){
        uploadOne(n, p._file, p);          /* 上传本身失败：重传 */
        return;
      }
      try{
        const d = await api(`/photos/${p.id}/reprocess`, {method: 'POST'});
        Object.assign(p, mapPhoto(d));
        renderGrid(n); watch(p, n);
        toast('已重新入显影队列', 'ok');
      }catch(err){
        if(p._file){ uploadOne(n, p._file, p); return; }   /* 原图缺失：重新走上传 */
        toast(errMsg(err, '重试失败'), 'err');
      }
    }
  };
  /* 木夹把手拖拽排序（pointer 版，桌面/触屏通用） */
  g.querySelectorAll('.handle').forEach(h => {
    h.addEventListener('pointerdown', e => {
      e.preventDefault();
      const card = h.closest('.card'); const from = card.dataset.id;
      card.classList.add('dragging'); h.setPointerCapture(e.pointerId);
      let target = null;
      const move = ev => {
        const el = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.card');
        g.querySelectorAll('.card').forEach(c => c.classList.remove('dropTarget'));
        target = (el && el !== card) ? el : null;
        if(target) target.classList.add('dropTarget');
      };
      const up = async () => {
        h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up);
        card.classList.remove('dragging');
        g.querySelectorAll('.card').forEach(c => c.classList.remove('dropTarget'));
        if(target){
          const prev = [...n.photos];
          const arr = n.photos;
          const fi = arr.findIndex(x => x.id === from), ti = arr.findIndex(x => x.id === target.dataset.id);
          const [mv] = arr.splice(fi, 1); arr.splice(ti, 0, mv);
          renderGrid(n);
          try{ await pushOrder(n, prev); toast('顺序已更新', 'ok'); }catch(_){}
        }
      };
      h.addEventListener('pointermove', move); h.addEventListener('pointerup', up);
    });
  });
}

$('#bulkAll').addEventListener('click', () => {
  const n = node(state.sel); if(!n) return;
  n.photos.forEach(p => { if(!String(p.id).startsWith('tmp-')) sel.add(p.id); });
  syncSel();
});
$('#bulkNone').addEventListener('click', clearSel);

/* 逐条汇报结果：批量移动时个别照片因目标已有同图而冲突是常态，
   不该因此让整批失败，也不该含糊地只说"部分失败" */
function reportBatch(res, verb){
  if(res.failed && res.failed.length){
    const why = res.failed[0].reason || '未知原因';
    toast(`${verb} ${res.succeeded} 张，${res.failed.length} 张未处理：${why}`, 'err');
  }else{
    toast(`已${verb} ${res.succeeded} 张`, 'ok');
  }
}

$('#bulkMove').addEventListener('click', async () => {
  const n = node(state.sel); if(!n || !sel.size) return;
  const ids = [...sel];
  const target = await pickNode(n.id, `把选中的 ${ids.length} 张移到：`);
  if(!target) return;
  try{
    const res = await api('/photos/batch', {method: 'POST',
      body: {action: 'move', photo_ids: ids, node_id: target}});
    const moved = new Set(ids.filter(id => !(res.failed || []).some(f => f.id === id)));
    n.photos = n.photos.filter(p => !moved.has(p.id));
    const tn = node(target);
    if(tn){
      /* 目标节点的照片下次选中时按需重取，这里只失效缓存并更新计数 */
      tn._loaded = false; tn.photos = [];
      tn.photo_count = (tn.photo_count || 0) + moved.size;
    }
    n.photo_count = n.photos.length;
    clearSel(); renderGrid(n); renderList(); renderStats();
    reportBatch(res, '移动');
  }catch(err){
    toast(errMsg(err, '批量移动失败'), 'err');
  }
});

$('#bulkDel').addEventListener('click', async () => {
  const n = node(state.sel); if(!n || !sel.size) return;
  const ids = [...sel];
  if(!await confirmBox(`删除选中的 ${ids.length} 张？`,
      '将进入回收站，7 天内可恢复。')) return;
  try{
    const res = await api('/photos/batch', {method: 'POST',
      body: {action: 'delete', photo_ids: ids}});
    const gone = new Set(ids.filter(id => !(res.failed || []).some(f => f.id === id)));
    n.photos = n.photos.filter(p => !gone.has(p.id));
    n.photo_count = n.photos.length;
    state.trash = (await api('/trash')).items;
    clearSel(); renderGrid(n); renderList(); renderStats(); renderTrashBadge();
    reportBatch(res, '删除');
  }catch(err){
    toast(errMsg(err, '批量删除失败'), 'err');
  }
});

/* ================= 新建节点 ================= */
$('#newNode').addEventListener('click', async () => {
  try{
    const d = await api('/nodes', {method: 'POST',
      body: {date: new Date().toISOString().slice(0, 10), title: '未命名节点', description: ''}});
    const n = mapNode(d);
    n._loaded = true;                     /* 新节点必然是空的，不必再请求 */
    state.nodes.unshift(n); state.sel = n.id;
    renderAll(); $('#mainView').classList.add('showDetail');
    setTimeout(() => { $('#fTitle')?.focus(); $('#fTitle')?.select(); }, 50);
  }catch(err){
    toast(errMsg(err, '新建失败'), 'err');
  }
});

/* ================= 回收站 ================= */
$('#trashBtn').addEventListener('click', async () => {
  try{ state.trash = (await api('/trash')).items; }catch(_){}
  renderTrashBadge();
  $('#mainView').style.display = 'none';
  $('#trashView').style.display = 'block';
  renderTrash();
});
$('#trashBack').addEventListener('click', () => {
  $('#trashView').style.display = 'none';
  $('#mainView').style.display = 'grid';
});
function daysLeft(purgeAt){
  return Math.max(0, Math.ceil((new Date(purgeAt) - Date.now()) / 86400000));
}
function renderTrash(){
  const el = $('#trashList');
  if(!state.trash.length){ el.innerHTML = '<div class="t-empty">回收站是空的</div>'; return; }
  el.innerHTML = state.trash.map((t, i) => `
    <div class="t-item">
      <div class="ty">${t.type === 'node' ? '节点' : '照片'}</div>
      <div class="nm">${esc(t.name || '（无题）')}</div>
      ${t.type === 'node'
        ? `<div class="mono" style="font-size:11px;color:var(--muted)">${esc(t.extra?.date || '')} · ${Number(t.extra?.photo_count) || 0} 张</div>`
        : `<div class="mono" style="font-size:11px;color:var(--muted)">来自「${esc(t.extra?.node_title || '')}」</div>`}
      <div class="cd">${daysLeft(t.purge_at)} 天后自动清除</div>
      <div class="row">
        <button class="btn" style="padding:6px 14px;font-size:12.5px" data-restore="${i}">恢复</button>
      </div>
    </div>`).join('');
  el.onclick = async e => {
    const b = e.target.closest('[data-restore]'); if(!b) return;
    const t = state.trash[+b.dataset.restore]; if(!t) return;
    try{
      await api(t.type === 'node' ? `/nodes/${t.id}/restore` : `/photos/${t.id}/restore`,
                {method: 'POST'});
      await loadAll();
      if(!node(state.sel)) state.sel = state.nodes[0]?.id || null;
      clearSel();
      renderAll(); renderTrash();
      toast('已恢复', 'ok');
    }catch(err){
      toast(errMsg(err, '恢复失败'), 'err');
    }
  };
}
</script>
</body>
</html>
