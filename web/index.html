  lbLive.textContent = `第 ${idx+1} 张，共 ${album.length} 张：${album[idx].cap}`;
}
/* 换片这一段里关掉灯箱的实时毛玻璃：每帧都在动的画面配 backdrop-filter，
   会把整块模糊反复重算，实测连翻时帧率减半。停下来就恢复。 */
let busyT = 0;
function lbBusy(){
  document.body.classList.add('lb-busy');
  clearTimeout(busyT);
  busyT = setTimeout(() => document.body.classList.remove('lb-busy'), 780);
}

function slide(dir){
  if(animating || album.length<2) return;
  animating = true;
  lbBusy();
  setX(-dir*W, true);
  parallax(-dir*W);
  sparkTrail(dir, album[wrapIdx(idx + dir)]?.dom);
  const done = ()=>{
    idx = wrapIdx(idx+dir);
    renderPanes();
    /* 新到位的这张：像刚从显影盘里提出来，再被夹子挂稳 */
    swapIn(dir);
    animating = false;
    if(!swiped){ swiped = true; lbFooter.classList.add('hide-hint'); }
  };
  reduceMotion ? done() : setTimeout(done, 420);
}

/* 换片入场：显影 + 钟摆。track 每次都是新 DOM，加个 class 就能重新触发 */
function swapIn(dir){
  if(reduceMotion) return;
  track.style.setProperty('--sw', (dir > 0 ? 6.5 : -6.5) + 'deg');
  track.classList.remove('swap');
  void track.offsetWidth;                /* 强制重排，动画才会重放 */
  track.classList.add('swap');
}
function jump(i){
  if(animating || i===idx) return;
  if(reduceMotion){ idx=i; renderPanes(); return; }
  lbBusy();
  track.style.transition='opacity .15s ease'; track.style.opacity=0;
  setTimeout(()=>{
    idx=i; renderPanes(); swapIn(1);
    requestAnimationFrame(()=>{
      track.style.transition='opacity .2s ease'; track.style.opacity=1;
    });
  },160);
}
/* ================= 绽放特效 =================
   点开一张相纸时，从它原来的位置炸开一蓬火花——老式镁光灯（flash powder）
   点燃的那一瞬：先一道白光，再是四散的火星，边落边熄。
   火花颜色取这张照片自己的主色，所以每张炸出来的颜色都不一样。
   canvas 只在特效期间存在，放完即销毁；prefers-reduced-motion 下整个跳过。 */
const SPARK_BASE = [[217,160,91], [237,229,216], [212,85,59]];   /* 琥珀 / 象牙 / 安全灯 */

function rgbOf(hex){
  const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex || '');
  return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : null;
}
/* 照片主色往往偏暗，火星得亮起来才像在燃烧 */
function ember(c){
  return c.map(v => Math.round(Math.min(255, v * .55 + 150)));
}

let sparkCv = null, sparkCtx = null, sparkParts = [], sparkRAF = 0, sparkFlash = 0;
let sparkBox = {x: 0, y: 0, w: 0, h: 0};
let sparkRing = -1;                     /* 冲击波圆环的推进进度，<0 表示不画 */

function sparkStop(){
  cancelAnimationFrame(sparkRAF);
  sparkRAF = 0; sparkParts = [];
  sparkCv?.remove();
  sparkCv = null; sparkCtx = null;
  document.body.classList.remove('sparking');
}

function burstAt(x, y, dominant, opt){
  if(reduceMotion) return;
  const o = Object.assign({
    n: innerWidth < 640 ? 64 : 112,   /* 火星数 */
    fast: 8.5, slow: 3.4,             /* 快/慢两层的速度上限 */
    lift: 1.6,                        /* 上抛量 */
    flash: 1, ring: true,             /* 闪光与冲击波 */
    dir: 0, spread: Math.PI * 2,      /* 方向偏置与张角：0 表示整圈铺开 */
    span: 0,                          /* 沿竖直方向的发射长度：0 是点源 */
  }, opt);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if(!sparkCv){
    sparkCv = document.createElement('canvas');
    sparkCv.className = 'sparks';
    document.body.appendChild(sparkCv);
    sparkCtx = sparkCv.getContext('2d');
  }
  sparkBox = {x: 0, y: 0, w: innerWidth, h: innerHeight};
  sparkCv.style.left = '0'; sparkCv.style.top = '0';
  sparkCv.style.width = innerWidth + 'px';
  sparkCv.style.height = innerHeight + 'px';
  sparkCv.width = innerWidth * dpr;
  sparkCv.height = innerHeight * dpr;
  sparkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  document.body.classList.add('sparking');

  const own = rgbOf(dominant);
  const palette = own ? [ember(own), ember(own), ...SPARK_BASE] : SPARK_BASE;
  const scale = Math.min(1, innerWidth / 1280) * .5 + .6;

  for(let i = 0; i < o.n; i++){
    /* 角度均匀铺开再加抖动，避免出现规则的放射线；
       换片时只朝一侧扇形喷出（dir 是中轴，spread 是张角） */
    const a = o.dir + ((i / o.n) - (o.spread < Math.PI * 2 ? .5 : 0)) * o.spread
              + (Math.random() - .5) * .5;
    /* 速度分两层：大部分飞得远，小部分留在近处慢慢熄，才有层次 */
    const sp = (Math.random() < .72 ? o.fast * .65 + Math.random() * o.fast
                                    : 1.4 + Math.random() * o.slow) * scale;
    /* 沿相纸整条边撕开，比从一个点喷出去显眼得多 */
    const oy = o.span ? (Math.random() - .5) * o.span : 0;
    sparkParts.push({
      x, y: y + oy, px: x, py: y + oy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - o.lift,       /* 略微上抛，落下来才好看 */
      life: 30 + Math.random() * 34, age: 0,
      w: .9 + Math.random() * 2.1,
      c: palette[(Math.random() * palette.length) | 0],
      split: Math.random() < .3 ? 1 : 0,   /* 三成会在半路二次绽开 */
    });
  }
  sparkFlash = o.flash;
  sparkRing = o.ring ? 0 : -1;
  if(!sparkRAF) sparkRAF = requestAnimationFrame(sparkTick);
}

/* 换片时从相纸离开的那一侧带出一小撮火星，不放闪光也不放冲击波 */
let lastTrail = 0;
function sparkTrail(dir, dominant){
  if(reduceMotion) return;
  const frame = track.children[1]?.querySelector('.lb-frame');
  if(!frame) return;
  const now = performance.now();
  if(now - lastTrail < 260) return;      /* 按住方向键狂翻时别堆积 */
  lastTrail = now;
  const r = frame.getBoundingClientRect();
  burstAt(dir > 0 ? r.right - 4 : r.left + 4, r.top + r.height * .48, dominant, {
    n: innerWidth < 640 ? 22 : 40,
    fast: 8, slow: 3, lift: .9,
    flash: .42, ring: false,             /* 一点闪光，让"换片"这一下有存在感 */
    dir: dir > 0 ? 0 : Math.PI,          /* 朝相纸滑走的反方向甩 */
    spread: Math.PI * .95,
    span: r.height * .8,                 /* 沿相纸竖边整条撕开 */
  });
}

function sparkTick(){
  if(!sparkCtx){ sparkRAF = 0; return; }
  const w = sparkBox.w, h = sparkBox.h;
  sparkCtx.clearRect(0, 0, w, h);

  /* 镁光灯炸开的那道白光：一圈迅速扩散、迅速淡掉的暖白 */
  if(sparkFlash > 0.01 && sparkParts.length){
    const p0 = sparkParts[0];
    const r = (1 - sparkFlash) * 260 + 24;
    const g = sparkCtx.createRadialGradient(p0.x, p0.y, 0, p0.x, p0.y, r);
    g.addColorStop(0, `rgba(255,244,224,${sparkFlash * .5})`);
    g.addColorStop(.55, `rgba(255,226,180,${sparkFlash * .16})`);
    g.addColorStop(1, 'rgba(255,220,170,0)');
    sparkCtx.fillStyle = g;
    sparkCtx.fillRect(0, 0, w, h);
    sparkFlash *= .82;
  }

  sparkCtx.lineCap = 'round';
  sparkCtx.globalCompositeOperation = 'lighter';   /* 火星叠加才有灼亮感 */

  /* 冲击波：一圈迅速铺开又立刻散掉的细环 */
  if(sparkRing >= 0 && sparkRing < 1 && sparkParts.length){
    const p0 = sparkParts[0];
    sparkRing += .075;
    const rr = sparkRing * 300 + 10;
    sparkCtx.strokeStyle = `rgba(255,236,206,${(1 - sparkRing) * .5})`;
    sparkCtx.lineWidth = 2.4 * (1 - sparkRing) + .4;
    sparkCtx.beginPath();
    sparkCtx.arc(p0.x, p0.y, rr, 0, Math.PI * 2);
    sparkCtx.stroke();
  }

  const born = [];
  sparkParts = sparkParts.filter(p => {
    p.px = p.x; p.py = p.y;
    p.vy += .085;                /* 重力：比真火星轻，飘得开一点 */
    p.vx *= .987; p.vy *= .987;  /* 空气阻力 */
    p.x += p.vx; p.y += p.vy;
    p.age++;
    const t = p.age / p.life;
    if(t >= 1) return false;
    /* 二次绽开：半路炸成两三粒小火星，烟花的第二层 */
    if(p.split && t > .42){
      p.split = 0;
      const k = 2 + ((Math.random() * 2) | 0);
      for(let i = 0; i < k; i++){
        const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 2.6;
        born.push({
          x: p.x, y: p.y, px: p.x, py: p.y,
          vx: p.vx * .3 + Math.cos(a) * sp,
          vy: p.vy * .3 + Math.sin(a) * sp,
          life: 16 + Math.random() * 18, age: 0,
          w: .6 + Math.random() * 1.1, c: p.c, split: 0,
        });
      }
    }
    /* 快熄灭时闪一下，像余烬 */
    const flick = t > .6 ? (.5 + Math.random() * .5) : 1;
    sparkCtx.strokeStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${(1 - t) * flick})`;
    sparkCtx.lineWidth = p.w * (1 - t * .55);
    sparkCtx.beginPath();
    /* 拖尾拉长到两帧多的位移，飞得快的火星才拖得出线 */
    sparkCtx.moveTo(p.x - p.vx * 2.4, p.y - p.vy * 2.4);
    sparkCtx.lineTo(p.x, p.y);
    sparkCtx.stroke();
    return true;
  });
  if(born.length) sparkParts.push(...born);
  sparkCtx.globalCompositeOperation = 'source-over';

  if(sparkParts.length || sparkFlash > 0.01 || (sparkRing >= 0 && sparkRing < 1)){
    sparkRAF = requestAnimationFrame(sparkTick);
  }else{
    sparkStop();
  }
}

function openLB(node, photoEl){
  const readys = [...node.querySelectorAll('.photo')].filter(el => el._photo?.status === 'ready');
  if(!readys.length) return;
  album = readys.map(el => ({
    md:  el._photo.variants.md || el._photo.variants.thumb || '',
    lg:  el._photo.variants.lg || '',
    cap: el._photo.caption,
    date: el.dataset.date,
    dom: el._photo.dominant || '',
    note: el._photo.note || '',
    place: node.dataset.place || '',
    taken: (el._photo.taken_at || '').slice(0, 10),
  }));
  idx = Math.max(0, readys.indexOf(photoEl));
  /* 从这张相纸原来挂着的位置炸开，火花取它自己的主色 */
  const r = photoEl.getBoundingClientRect();
  burstAt(r.left + r.width / 2, r.top + r.height * .42, photoEl._photo?.dominant);
  lastFocus = document.activeElement;                 /* 记住来源，关闭时归还焦点 */
  lb.classList.add('on','first-open');
  setTimeout(()=>lb.classList.remove('first-open'), 420);
  document.documentElement.style.overflow = 'hidden';
  renderPanes();
  lbFooter.classList.toggle('hide-hint', swiped || album.length<2);
  setTimeout(()=>lbCloseBtn.focus(), 0);              /* 焦点移入弹层 */
}
function closeLB(){
  sparkStop();
  clearTimeout(busyT);
  document.body.classList.remove('lb-busy');
  lb.classList.remove('on');
  document.documentElement.style.overflow = '';
  viewport.style.transform = '';
  lb.style.background = '';
  track.style.opacity = '';
  resetZoom();
  lastFocus?.focus?.();                               /* 焦点归还给原照片 */
}

/* ---- 手势：滑动 / 甩动 / 下滑关闭 / 双指缩放 / 单指平移 / 双击缩放 ---- */
let gx0=0, gy0=0, gt0=0, gdx=0, gdy=0, axis=null, tracking=false, justDragged=false;
const pointers = new Map();

viewport.addEventListener('pointerdown', e=>{
  if(animating) return;
  /* 按在相纸上的按钮时不接管指针：setPointerCapture 会把后续 click 的
     target 换成 viewport，事件委托就再也认不出这个按钮了 */
  if(e.target.closest('button')) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try{ viewport.setPointerCapture(e.pointerId); }catch(_){}
  track.style.transition='none'; track.classList.remove('anim');

  if(pointers.size === 2){
    /* 第二根手指落下 → 进入捏合，取消滑动 */
    tracking=false; axis=null; setX(0);
    const [a,b] = [...pointers.values()];
    const r = zoomRect(); if(!r) return;
    pinch0 = {
      d: Math.hypot(a.x-b.x, a.y-b.y) || 1,
      mx:(a.x+b.x)/2 - r.left, my:(a.y+b.y)/2 - r.top,
      s: zs, tx: ztx, ty: zty
    };
  }else if(pointers.size === 1){
    tracking = true; axis = null;
    gx0=e.clientX; gy0=e.clientY; gt0=performance.now(); gdx=0; gdy=0;
    pan0 = {tx:ztx, ty:zty};
  }
});
viewport.addEventListener('pointermove', e=>{
  const pt = pointers.get(e.pointerId);
  if(pt){ pt.x=e.clientX; pt.y=e.clientY; }

  /* 捏合缩放：以双指中点为锚 */
  if(pinch0 && pointers.size >= 2){
    const [a,b] = [...pointers.values()];
    const r = zoomRect(); if(!r) return;
    const d  = Math.hypot(a.x-b.x, a.y-b.y);
    const mx = (a.x+b.x)/2 - r.left, my = (a.y+b.y)/2 - r.top;
    zs = Math.min(4, Math.max(1, pinch0.s * d / pinch0.d));
    const k = zs / pinch0.s;
    ztx = mx - (pinch0.mx - pinch0.tx) * k;
    zty = my - (pinch0.my - pinch0.ty) * k;
    clampPan(); applyZoom();
    return;
  }
  if(!tracking) return;
  gdx = e.clientX - gx0;
  gdy = e.clientY - gy0;

  /* 已放大：单指变为画面平移，不再切图/关闭 */
  if(zs > 1.02){
    ztx = pan0.tx + gdx; zty = pan0.ty + gdy;
    clampPan(); applyZoom();
    return;
  }
  if(!axis && (Math.abs(gdx) > 8 || Math.abs(gdy) > 8)){
    axis = Math.abs(gdx) >= Math.abs(gdy) ? 'x' : 'y';
  }
  if(axis === 'x'){
    const px = album.length > 1 ? gdx : gdx * .25;
    setX(px); parallax(px);
  }else if(axis === 'y'){
    const ty = Math.max(0, gdy);
    viewport.style.transform = `translateY(${ty}px)`;
    const fade = Math.min(ty / 420, .55);
    lb.style.background = `rgba(${lbRGB()},${(.84 * (1 - fade)).toFixed(3)})`;
  }
});
viewport.addEventListener('pointerup', e=>{
  pointers.delete(e.pointerId);

  if(pinch0){
    if(pointers.size < 2){
      pinch0 = null;
      if(zs < 1.06) resetZoom(true);
      justDragged = true; setTimeout(()=>justDragged=false, 80);
    }
    return;
  }
  if(!tracking) return;

  /* 双击 / 双触：放大到 2.5 倍（以点按处为中心）或还原 */
  const now = performance.now();
  const still = Math.abs(gdx) < 10 && Math.abs(gdy) < 10;
  if(still){
    if(now - lastTap.t < 320 &&
       Math.hypot(e.clientX-lastTap.x, e.clientY-lastTap.y) < 40){
      lastTap.t = 0;
      const r = zoomRect();
      if(zs > 1){ resetZoom(true); }
      else if(r){
        zs = 2.5;
        ztx = (e.clientX - r.left) * (1 - zs);
        zty = (e.clientY - r.top ) * (1 - zs);
        clampPan(); applyZoom(true);
      }
      tracking=false; axis=null;
      justDragged = true; setTimeout(()=>justDragged=false, 80);
      return;
    }
    lastTap = {t:now, x:e.clientX, y:e.clientY};
  }
  tracking = false;

  if(zs > 1.02){          /* 平移结束 */
    justDragged = Math.abs(gdx)>6 || Math.abs(gdy)>6;
    setTimeout(()=>justDragged=false, 60);
    axis = null;
    return;
  }
  const dt = Math.max(1, performance.now() - gt0);
  const vx = gdx / dt, vy = gdy / dt;
  if(axis === 'x'){
    justDragged = Math.abs(gdx) > 6;
    if(album.length > 1 && (Math.abs(gdx) > 70 || Math.abs(vx) > .35)){
      slide(gdx < 0 ? 1 : -1);
    }else{
      setX(0, true); parallax(0);
    }
  }else if(axis === 'y'){
    justDragged = gdy > 6;
    if(gdy > 110 || vy > .5){
      viewport.style.transition = reduceMotion ? 'none' : 'transform .28s ease-in';
      viewport.style.transform = 'translateY(70vh)';
      setTimeout(()=>{ viewport.style.transition=''; closeLB(); }, reduceMotion?0:280);
    }else{
      viewport.style.transition = reduceMotion ? 'none' : 'transform .3s cubic-bezier(.22,.9,.3,1)';
      viewport.style.transform = '';
      lb.style.background = '';
      setTimeout(()=>viewport.style.transition='', 320);
    }
  }
  setTimeout(()=>justDragged=false, 60);
  axis = null;
});
viewport.addEventListener('pointercancel', e=>{
  pointers.delete(e.pointerId);
  pinch0=null; tracking=false; axis=null;
  setX(0,true); parallax(0);
  viewport.style.transform=''; lb.style.background='';
});

/* 翻到相纸背面看手记；换页/关灯箱都会自动翻回正面 */
function flipCard(force){
  const card = track.children[1];
  if(!card || !card.querySelector('.lb-back')) return;   /* 没写过字就没有背面 */
  const on = force === undefined ? !card.classList.contains('flipped') : force;
  card.classList.toggle('flipped', on);
  const btn = card.querySelector('.lb-flipbtn .tx');
  if(btn) btn.textContent = on ? '正面' : '背面';
  if(on) card.querySelector('.hand')?.focus?.();
}

/* ---- 点击行为 ---- */
document.addEventListener('click', e=>{
  if(e.target.closest('[data-flip]')){ flipCard(); return; }
  const dot = e.target.closest('.lb-dots button');
  if(dot){ jump([...lbDots.children].indexOf(dot)); return; }
  const p = e.target.closest('.node.open .photo');
  if(p){
    if(p._photo?.status === 'ready') openLB(p.closest('.node'), p);
    return;
  }
  if(lb.classList.contains('on') && !justDragged &&
     e.target.classList.contains('lb-card')) closeLB();
});
lbCloseBtn.addEventListener('click', closeLB);
document.getElementById('lbPrev').addEventListener('click', ()=>slide(-1));
document.getElementById('lbNext').addEventListener('click', ()=>slide(1));

document.addEventListener('keydown', e=>{
  if(lb.classList.contains('on')){
    if(e.key==='Escape'){
      /* 背面朝上时，Esc 先翻回正面，再按一次才关 */
      if(track.children[1]?.classList.contains('flipped')){ flipCard(false); return; }
      closeLB();
    }
    if(e.key==='ArrowLeft') slide(-1);
    if(e.key==='ArrowRight') slide(1);
    if(e.key==='f' || e.key==='F' || e.key==='ArrowUp' || e.key==='ArrowDown'){
      e.preventDefault(); flipCard();
    }
    if(e.key==='Tab'){
      /* 焦点圈在弹层内循环 */
      const f = [...lb.querySelectorAll('button')].filter(b=>b.offsetParent!==null);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      else if(!lb.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    }
  } else if(document.activeElement?.classList.contains('photo')){
    const cur = document.activeElement, nd = cur.closest('.node');
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); cur.click(); return; }
    const ps = [...nd.querySelectorAll('.photo')], i = ps.indexOf(cur);
    let t = null;
    if(e.key==='ArrowRight')     t = ps[Math.min(i + 1, ps.length - 1)];
    else if(e.key==='ArrowLeft') t = ps[Math.max(i - 1, 0)];
    else if(e.key==='Home')      t = ps[0];
    else if(e.key==='End')       t = ps[ps.length - 1];
    if(t && t !== cur){
      e.preventDefault();
      roving(nd, t); t.focus({preventScroll:true}); develop(t);
      t.scrollIntoView({block:'nearest', inline:'center',
                        behavior: reduceMotion ? 'auto' : 'smooth'});
    }
  }
});
addEventListener('resize', ()=>{ if(lb.classList.contains('on')) renderPanes(); });

/* ================= 首屏加载 ================= */
/* 首屏只争照片：那年今日与信箱都是锦上添花，等时间轴落地了再去拿，
   免得四个请求一起挤在开局抢带宽。 */
loadPage().then(() => {
  sentinelIO.observe(sentinel);
  const idle = window.requestIdleCallback || (fn => setTimeout(fn, 250));
  idle(() => { loadOnThisDay(); loadLetters(); }, {timeout: 1500});
});
