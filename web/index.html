<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#161310">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>拾光集 · 暗房时间轴</title>
<style>
  /* 不加载网络字体：CSS @import 是渲染阻塞的，fonts.googleapis.com 在部分
     网络环境不可达时会让整页白屏干等十几秒。下面的字体栈已覆盖
     macOS(PingFang/Songti)、Windows(微软雅黑/宋体)、iOS、Android 中文系统。 */

  :root{
    --bg:#161310;
    --bg-soft:#1D1915;
    --ivory:#EDE5D8;
    --muted:#9A8E7E;
    --faint:#5E564A;
    --amber:#D9A05B;
    --safelight:#D4553B;
    --line:#332D25;
    --hairline:rgba(51,45,37,.55);
    --ghost:rgba(237,229,216,.13);
    --print:#F7F2E8;
    --paper-raw:#E7DFC9;          /* 未显影的相纸底色 */
    --print-ink:#4A4238;
    --print-sub:#8C8172;
    --sh-photo:0 3px 6px rgba(0,0,0,.45),0 14px 34px rgba(0,0,0,.35);
    --sh-photo-hover:0 6px 10px rgba(0,0,0,.5),0 26px 50px rgba(0,0,0,.5);
    --lb-bg:rgba(14,12,10,.82);
    --serif:'Noto Serif SC','Songti SC','SimSun',serif;
    --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
    --pw:168px;
    --ph:150px;
    --peek:52px;                  /* 折叠摞每张露出的宽度：要露到画面，不能只露纸边 */
    --grain:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="140" height="140" filter="url(%23n)" opacity="0.55"/></svg>');
  }
  body.light{
    --bg:#EFEAE0;
    --bg-soft:#F7F3EA;
    --ivory:#2E2A24;
    --muted:#6E6455;
    --faint:#8C8171;
    --amber:#82601F;
    --safelight:#C24A32;
    --line:#DCD4C4;
    --hairline:rgba(190,178,156,.6);
    --ghost:rgba(46,42,36,.14);
    --print:#FFFDF8;
    --paper-raw:#EFE9DA;
    --sh-photo:0 2px 5px rgba(90,75,55,.18),0 12px 28px rgba(90,75,55,.16);
    --sh-photo-hover:0 5px 9px rgba(90,75,55,.22),0 22px 44px rgba(90,75,55,.24);
    --lb-bg:rgba(243,238,228,.88);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ivory);
    font-family:var(--sans);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background-color .6s ease,color .6s ease;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(640px 380px at 78% -6%, rgba(212,85,59,.10), transparent 70%),
      radial-gradient(520px 340px at 8% 4%, rgba(217,160,91,.06), transparent 70%);
    transition:opacity .6s ease;
  }
  body.light::before{
    background:
      radial-gradient(720px 420px at 78% -6%, rgba(255,220,160,.5), transparent 70%),
      radial-gradient(560px 360px at 8% 4%, rgba(255,240,214,.45), transparent 70%);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
    background-image:var(--grain);opacity:.05;mix-blend-mode:overlay;
  }
  body.light::after{opacity:.035;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px;}
  .sr-only{
    position:absolute;width:1px;height:1px;overflow:hidden;
    clip-path:inset(50%);white-space:nowrap;
  }

  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 28px;}

  /* ============ 拉线开关 ============ */
  .cord{
    position:fixed;top:0;right:min(7vw,72px);z-index:40;
    width:28px;height:96px;
    display:flex;flex-direction:column;align-items:center;
    transform-origin:top center;
  }
  .cord-line{width:2px;flex:1;background:linear-gradient(180deg,#4A4133,#8A7A5F);border-radius:1px;}
  .cord-knob{
    width:13px;height:24px;border-radius:7px;margin-top:-1px;
    background:linear-gradient(180deg,#D9A05B,#8F6A2A);
    box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);
    transition:box-shadow .3s ease;
  }
  .cord:hover .cord-knob{box-shadow:0 2px 10px rgba(217,160,91,.55),inset 0 1px 0 rgba(255,255,255,.35);}
  .cord.pulled{animation:cordPull .55s cubic-bezier(.3,.7,.35,1.3);}
  @keyframes cordPull{
    0%{transform:translateY(0);}35%{transform:translateY(15px);}
    70%{transform:translateY(-3px);}100%{transform:translateY(0);}
  }

  /* ============ 年份侧边导航 ============ */
  .year-nav{
    position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:30;
    display:flex;flex-direction:column;gap:20px;
  }
  .year-nav .yr{
    display:flex;align-items:center;justify-content:flex-end;gap:9px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;
    color:var(--muted);padding:2px 0;
    transition:color .3s ease;
  }
  .year-nav .yr span{transition:opacity .3s ease;}
  .year-nav .yr i{
    display:block;width:14px;height:1px;background:currentColor;
    transition:width .3s ease,height .3s ease;
  }
  .year-nav .yr.act{color:var(--amber);}
  .year-nav .yr.act i{width:24px;height:2px;}
  .year-nav .yr:hover{color:var(--amber);}

  /* ============ 页头 ============ */
  header{padding:76px 0 0;}
  .eyebrow{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.32em;
    color:var(--amber);text-transform:uppercase;
  }
  .eyebrow i{font-style:normal;color:var(--faint);margin:0 10px;}
  h1{
    margin-top:18px;
    font-family:var(--serif);font-weight:900;
    font-size:clamp(44px,8.5vw,76px);
    letter-spacing:.14em;line-height:1.1;
  }
  h1 em{font-style:normal;color:var(--safelight);}
  .lede{margin-top:18px;max-width:36em;color:var(--muted);font-size:15px;}
  .head-row{margin-top:26px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;}
  .stats{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.08em;}
  .stats b{color:var(--muted);font-weight:400;}
  .sprocket{
    margin-top:44px;height:14px;
    background:repeating-linear-gradient(90deg,
      transparent 0 10px, var(--line) 10px 24px, transparent 24px 34px);
    -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
    mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
    border-radius:3px;opacity:.8;
  }

  /* ============ 那年今日 ============ */
  .onthisday{
    margin-top:30px;display:none;
    border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,rgba(212,85,59,.07),rgba(212,85,59,.02));
    padding:16px 18px;
  }
  .onthisday.on{display:block;animation:otdIn .8s ease .4s backwards;}
  @keyframes otdIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;}}
  .otd-head{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;color:var(--safelight);
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
  }
  .otd-head::after{content:"";flex:1;height:1px;background:var(--line);}
  .otd-list{display:flex;gap:12px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  .otd-item{
    flex:none;display:flex;align-items:center;gap:11px;text-align:left;
    border:1px solid var(--line);border-radius:11px;padding:8px 14px 8px 8px;
    background:var(--bg-soft);
    transition:border-color .25s,transform .25s;
  }
  .otd-item:hover{border-color:var(--amber);transform:translateY(-2px);}
  .otd-thumb{
    width:46px;height:46px;border-radius:6px;flex:none;
    background:var(--paper-raw) center/cover;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .otd-when{font-family:var(--mono);font-size:10.5px;color:var(--amber);letter-spacing:.1em;}
  .otd-title{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.04em;
    white-space:nowrap;max-width:15em;overflow:hidden;text-overflow:ellipsis;}
  .otd-sub{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em;}

  /* ============ 时间轴 ============ */
  main{padding:26px 0 120px;}
  .timeline{position:relative;padding-left:40px;}
  .timeline::before{
    content:"";position:absolute;left:9px;top:12px;bottom:0;width:1px;
    background:linear-gradient(180deg,var(--line) 0 92%,transparent);
  }

  .year{position:relative;height:96px;display:flex;align-items:flex-end;margin-top:34px;scroll-margin-top:24px;}
  .year strong{
    position:absolute;left:-8px;bottom:-14px;
    font-family:var(--serif);font-weight:900;
    font-size:clamp(76px,13vw,120px);letter-spacing:.04em;
    color:transparent;
    -webkit-text-stroke:1px var(--ghost);
    user-select:none;pointer-events:none;line-height:1;
  }
  .year span{
    position:relative;font-family:var(--mono);font-size:12px;
    color:var(--amber);letter-spacing:.24em;padding-bottom:4px;
  }
  .year span::before{
    content:"";position:absolute;left:-31px;bottom:10px;
    width:9px;height:9px;transform:rotate(45deg);
    background:var(--bg);border:1px solid var(--amber);
  }

  .node{
    position:relative;padding:34px 0 10px;
    content-visibility:auto;                 /* 长列表性能：屏外节点跳过渲染 */
    contain-intrinsic-size:auto 340px;
  }
  .node + .node{border-top:1px solid var(--hairline);}
  .node.flash{animation:nodeFlash 1.6s ease;}
  @keyframes nodeFlash{
    0%,100%{background:transparent;}
    18%{background:rgba(217,160,91,.1);}
  }
  .node::before{
    content:"";position:absolute;left:-35px;top:47px;
    width:8px;height:8px;border-radius:50%;
    background:var(--safelight);
    box-shadow:0 0 0 4px var(--bg),0 0 14px rgba(212,85,59,.55);
  }

  .node-head{
    width:100%;text-align:left;
    display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;
  }
  .node-date{font-family:var(--mono);font-size:12.5px;color:var(--amber);letter-spacing:.1em;}
  .node-title{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(20px,3.4vw,25px);letter-spacing:.06em;
    transition:color .3s ease;
  }
  .node-head:hover .node-title{color:var(--amber);}
  .node-meta{
    margin-left:auto;display:flex;align-items:center;gap:14px;
    font-family:var(--mono);font-size:11.5px;color:var(--faint);
    letter-spacing:.12em;white-space:nowrap;
  }
  .state{display:inline-flex;align-items:center;gap:7px;color:var(--muted);}
  .kbd-tip{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);
    margin-left:12px;opacity:0;transition:opacity .25s;
  }
  .node.open:focus-within .kbd-tip{opacity:1;}
  .state::before{content:"展开";}
  .node.open .state::before{content:"收起";}
  .plus{
    display:inline-grid;place-items:center;width:20px;height:20px;
    border:1px solid var(--line);border-radius:50%;
    font-size:13px;line-height:1;color:var(--amber);
    transition:transform .45s cubic-bezier(.22,.9,.3,1),border-color .3s;
  }
  .node.open .plus{transform:rotate(225deg);border-color:var(--amber);}
  .node-desc{margin-top:4px;color:var(--muted);font-size:14px;max-width:46em;}
  /* 地点：时间之外的第二条线索 */
  .node-place{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    color:var(--amber);border:1px solid rgba(217,160,91,.32);
    border-radius:20px;padding:2px 10px;margin-top:8px;
    transition:background .25s,border-color .25s,color .25s;
  }
  .node-place:hover{background:rgba(217,160,91,.12);border-color:var(--amber);}
  .node-place i{font-style:normal;opacity:.8;}
  .node[data-place=""] .node-place{display:none;}

  /* 地点里的其它日子 */
  .placebox{
    position:fixed;inset:0;z-index:96;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(14,12,10,.78);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  body.light .placebox{background:rgba(243,238,228,.86);}
  .placebox.on{display:flex;}
  .placebox .box{
    width:min(460px,94vw);max-height:76vh;display:flex;flex-direction:column;
    background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;
    padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.5);
  }
  .placebox h4{font-family:var(--serif);font-size:19px;letter-spacing:.06em;
    display:flex;align-items:baseline;gap:10px;}
  .placebox h4 span{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.14em;}
  .place-list{margin-top:16px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  .place-row{
    display:flex;align-items:center;gap:12px;text-align:left;
    padding:9px 10px;border-radius:10px;border:1px solid transparent;
    transition:background .2s,border-color .2s;
  }
  .place-row:hover{background:var(--bg);border-color:var(--line);}
  .place-row .th{width:40px;height:40px;border-radius:5px;flex:none;
    background:var(--paper-raw) center/cover;box-shadow:0 2px 5px rgba(0,0,0,.4);}
  .place-row .d{font-family:var(--mono);font-size:10.5px;color:var(--amber);}
  .place-row .t{font-family:var(--serif);font-weight:600;font-size:15px;}
  .place-row .c{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);}
  .placebox .close{margin-top:16px;align-self:flex-end;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--muted);
    padding:6px 12px;border:1px solid var(--line);border-radius:8px;}
  .placebox .close:hover{color:var(--ivory);border-color:var(--muted);}

  /* ============ 晾片区 ============ */
  .strip-wrap{
    position:relative;margin-top:22px;
    overflow:hidden;
    padding:18px 4px 26px;
    cursor:pointer;
    overscroll-behavior-x:contain;
  }
  .node.open .strip-wrap{
    cursor:grab;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
    -webkit-mask:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent);
    mask:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent);
  }
  .node.open .strip-wrap.dragging{cursor:grabbing;user-select:none;}
  .strip-wrap::-webkit-scrollbar{height:6px;}
  .strip-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  @media (hover:none){
    .node.open .strip-wrap{scroll-snap-type:x proximity;}
    .node.open .photo{scroll-snap-align:center;}
  }

  /* 钢丝在 .strip 内部，随内容滚动，覆盖全部照片 */
  .wire{
    position:absolute;left:0;right:0;top:2px;height:2px;
    pointer-events:none;
    background:linear-gradient(90deg,transparent,#7A6B54 6%,#A6926F 50%,#7A6B54 94%,transparent);
    box-shadow:0 1px 0 rgba(0,0,0,.6);
    transform:scaleX(0);transform-origin:center;
    transition:transform .65s cubic-bezier(.22,.9,.3,1);
  }
  .node.open .wire{transform:scaleX(1);}

  .strip{position:relative;display:flex;width:max-content;padding:14px 10px 0;}

  .photo{
    position:relative;flex:none;width:var(--pw);
    transition:
      margin .6s cubic-bezier(.22,.9,.3,1),
      transform .6s cubic-bezier(.22,.9,.3,1);
  }
  .print{
    background:var(--print);
    padding:9px 9px 0;border-radius:2px;
    box-shadow:var(--sh-photo);
    transform-origin:calc(50% + var(--clipx,0px)) -8px;
    transition:box-shadow .35s ease;
  }
  .node.open .photo{cursor:zoom-in;}

  /* 相纸画面：默认是未显影的空白相纸，图片就位后“显影”浮现 */
  .pic{
    position:relative;height:var(--ph);border-radius:1px;
    overflow:hidden;background:var(--paper-raw);
  }
  .ph-img{
    position:absolute;inset:0;z-index:0;
    background-size:cover;background-position:center;
    opacity:0;
    filter:contrast(.35) brightness(1.55) sepia(.5) blur(4px);
    transition:opacity 1.2s ease,filter 1.8s ease;
  }
  .ph-img.dev{opacity:1;filter:none;}
  .pic::before{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%,transparent 62%,rgba(10,8,6,.2));
  }
  .pic::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background-image:var(--grain);opacity:.1;mix-blend-mode:overlay;
  }
  .fail{
    position:absolute;inset:10px;z-index:2;display:none;
    align-items:center;justify-content:center;
    font-style:normal;font-family:var(--mono);font-size:10px;
    letter-spacing:.24em;color:#B4543E;
    border:1px dashed rgba(180,84,62,.55);
    transform:rotate(-6deg);
  }
  .pic.failed .fail{display:flex;}

  .photo figcaption{
    height:46px;display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--print-ink);
    padding:0 3px;overflow:hidden;
  }
  .photo figcaption i{
    font-style:normal;font-family:var(--mono);
    font-size:10px;color:var(--print-sub);letter-spacing:.06em;flex:none;
  }
  .photo figcaption b{
    font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .clip{
    position:absolute;top:-13px;left:calc(50% + var(--clipx,0px));z-index:2;
    width:13px;height:26px;border-radius:3px;
    transform:translateX(-50%);
    background:linear-gradient(180deg,#C79E63,#8A6739 70%,#6E5230);
    box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);
    opacity:0;transition:opacity .4s ease .25s;
  }
  .clip::after{
    content:"";position:absolute;left:50%;top:4px;bottom:4px;width:1.5px;
    transform:translateX(-50%);background:rgba(60,42,20,.55);border-radius:1px;
  }
  .node.open .clip{opacity:1;}

  /* 收起：叠成一摞（wire 占首位，用 nth-of-type 只数照片）；
     只露前 6 张，几百张的节点不至于拖出一整行未显影纸边 */
  .node:not(.open) .strip .photo:nth-of-type(n+7){display:none;}
  .strip .photo + .photo{margin-left:calc(-1 * (var(--pw) - var(--peek)));}
  /* 封面压在摞顶：DOM 顺序默认让最后一张盖住封面，这里把层序倒过来 */
  .node:not(.open) .strip .photo:nth-of-type(1){z-index:6;}
  .node:not(.open) .strip .photo:nth-of-type(2){z-index:5;}
  .node:not(.open) .strip .photo:nth-of-type(3){z-index:4;}
  .node:not(.open) .strip .photo:nth-of-type(4){z-index:3;}
  .node:not(.open) .strip .photo:nth-of-type(5){z-index:2;}
  .node:not(.open) .strip .photo:nth-of-type(6){z-index:1;}
  .strip .photo:nth-of-type(2n){transform:rotate(1.4deg) translateY(3px);}
  .strip .photo:nth-of-type(3n){transform:rotate(-1.2deg) translateY(1px);}
  .strip .photo:nth-of-type(n+2){pointer-events:none;}
  .node:not(.open) .strip:hover .photo:first-of-type{transform:rotate(-1.6deg) translateY(-4px);}
  .node:not(.open) .strip-wrap:hover .strip .photo + .photo{
    margin-left:calc(-1 * (var(--pw) - var(--peek) - 12px));
  }

  /* 展开：滑开 + 挂上后钟摆式回稳 */
  .node.open .strip .photo{margin-left:0;margin-right:22px;pointer-events:auto;transform:rotate(0deg);}
  .node.open .strip .photo:nth-of-type(2){transition-delay:.05s;}
  .node.open .strip .photo:nth-of-type(3){transition-delay:.1s;}
  .node.open .strip .photo:nth-of-type(4){transition-delay:.15s;}
  .node.open .strip .photo:nth-of-type(5){transition-delay:.2s;}
  .node.open .strip .photo:nth-of-type(6){transition-delay:.25s;}
  .node.open .strip .photo:nth-of-type(n+7){transition-delay:.3s;}

  .node.open .print{
    animation:hang 1.6s cubic-bezier(.3,.6,.4,1) both;
    animation-delay:var(--d,.2s);
  }
  @keyframes hang{
    0%  {transform:rotate(calc(var(--rot,0deg) + 4.5deg));}
    28% {transform:rotate(calc(var(--rot,0deg) - 2.8deg));}
    54% {transform:rotate(calc(var(--rot,0deg) + 1.5deg));}
    76% {transform:rotate(calc(var(--rot,0deg) - .7deg));}
    100%{transform:rotate(var(--rot,0deg));}
  }
  .node.open .photo:hover{transform:translateY(-5px);z-index:2;}
  .node.open .photo:hover .print{
    animation:sway 2.4s ease-in-out infinite;
    box-shadow:var(--sh-photo-hover);
  }
  @keyframes sway{
    0%,100%{transform:rotate(calc(var(--rot,0deg) - .8deg));}
    50%    {transform:rotate(calc(var(--rot,0deg) + .8deg));}
  }

  /* 空节点与补拉中的占位：展开后不该只剩一条空钢丝 */
  .strip-note{
    display:none;padding:26px 4px 10px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--faint);
  }
  .node.open.is-empty .strip-note,
  .node.open .strip-wrap.loading + .strip-note{display:block;}
  .node.open.is-empty .wire{opacity:.35;}

  /* 晾片带左右翻页按钮：只在桌面（可 hover + 精确指针）且确实可滚时浮现 */
  .strip-outer{position:relative;}
  .s-nav{
    position:absolute;top:calc(50% + 6px);transform:translateY(-50%);z-index:5;
    width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;
    font-size:21px;line-height:1;color:var(--ivory);
    background:rgba(29,25,21,.94);border:1px solid rgba(237,229,216,.42);
    box-shadow:0 4px 14px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease,background .25s,border-color .25s;
  }
  body.light .s-nav{
    background:rgba(255,253,246,.96);border-color:rgba(46,42,36,.3);
    box-shadow:0 4px 14px rgba(90,75,55,.25);
  }
  .s-nav:hover{background:var(--safelight);border-color:var(--safelight);color:#fff;}
  .s-prev{left:8px;} .s-next{right:8px;}
  @media (hover:hover) and (pointer:fine){
    .node.open .strip-outer.can-l .s-prev{opacity:1;pointer-events:auto;}
    .node.open .strip-outer.can-r .s-next{opacity:1;pointer-events:auto;}
  }

  /* ============ 灯箱 ============ */
  /* 火花层：盖在灯箱之上，但不吃任何点击 */
  .sparks{
    position:fixed;z-index:110;pointer-events:none;
    will-change:transform;                 /* 提升为独立合成层 */
  }
  /* 火花绽放期间灯箱不做实时毛玻璃：canvas 每帧重绘会连带把下面那层
     backdrop-filter 全屏重算一遍，实测帧率因此腰斩。换成加深的纯色底。 */
  body.sparking .lightbox,
  body.lb-busy .lightbox{
    -webkit-backdrop-filter:none;backdrop-filter:none;
    background:rgba(12,10,8,.93);
  }
  body.sparking.light .lightbox,
  body.lb-busy.light .lightbox{background:rgba(240,235,225,.95);}

  .lightbox{
    position:fixed;inset:0;z-index:100;
    background:var(--lb-bg);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:none;user-select:none;
    overscroll-behavior:contain;
  }
  .lightbox.on{display:block;}

  .lb-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;will-change:transform;}
  .lb-track{display:flex;height:100%;will-change:transform;}
  .lb-card{
    flex:none;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:28px 28px 64px;
  }
  .lb-frame{
    width:min(600px,92vw);
    background:var(--print);border-radius:3px;
    padding:14px 14px 0;
    box-shadow:0 40px 90px rgba(0,0,0,.6);
    will-change:transform;
    position:relative;
  }
  /* 相纸背面：老照片背面用铅笔写的那段话 */
  .lb-flip{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.35,1);}
  .lb-card.flipped .lb-flip{transform:rotateY(180deg);}
  /* 两面的显隐不依赖 backface-visibility：那个属性要求元素自身参与 3D
     变换才可靠，Safari 与部分 Chrome 上只靠父级 preserve-3d 会失效，
     结果就是翻到背面看见的是镜像的正面。这里改成在翻转过半（纸侧对
     观众、两面都看不见的那一瞬）硬切换可见性，视觉上完全一致。 */
  .lb-flip>.face,.lb-flip>.lb-back{
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    transform:rotateY(0deg);          /* 强制参与 3D，让上面那行有机会生效 */
    transition:opacity 0s linear .34s,visibility 0s linear .34s;
  }
  .lb-flip>.lb-back{transform:rotateY(180deg);}
  .lb-card.flipped .lb-flip>.face{opacity:0;visibility:hidden;pointer-events:none;}
  .lb-flip>.lb-back{opacity:0;visibility:hidden;pointer-events:none;}
  .lb-card.flipped .lb-flip>.lb-back{opacity:1;visibility:visible;pointer-events:auto;}
  .lb-back{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    /* 相纸背面：中间偏亮、四边微微发黄，像一张真的相纸背面 */
    background:
      radial-gradient(115% 75% at 50% 12%,rgba(255,253,246,.75),transparent 62%),
      var(--paper-raw);
    border-radius:2px;
    padding:clamp(26px,7%,46px) clamp(24px,8%,56px);
    overflow:hidden;
  }
  .lb-back::after{                       /* 背面也有纸纹 */
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:var(--grain);opacity:.22;mix-blend-mode:multiply;
  }
  .lb-back .stamp{
    flex:none;
    font-family:var(--mono);font-size:10px;letter-spacing:.24em;
    color:#A2957E;
    display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
  }
  .lb-back .stamp em{font-style:normal;color:#8A7C64;}
  /* 少量文字垂直居中（像随手写在纸中间），长文从顶部开始并可滚动 */
  .lb-hand-wrap{flex:1;min-height:0;overflow-y:auto;display:flex;
    scrollbar-width:thin;scrollbar-color:rgba(120,105,80,.3) transparent;}
  .lb-back .hand{
    margin:auto 0;width:100%;
    font-family:'Kaiti SC','KaiTi','STKaiti',var(--serif);
    font-size:clamp(15px,2.6vw,18px);line-height:2.1;color:#544A3A;
    white-space:pre-wrap;word-break:break-word;
    transform:rotate(-.35deg);           /* 手写不会绝对水平 */
  }
  /* 翻面按钮：压在相纸右下角，像一个纸角 */
  .lb-flipbtn{
    position:absolute;right:14px;bottom:60px;z-index:4;
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    color:var(--print-ink);background:rgba(255,255,255,.88);
    border:1px solid rgba(120,105,80,.25);border-radius:20px;padding:5px 12px;
    transition:color .2s,border-color .2s,background .2s;
  }
  .lb-flipbtn:hover{color:var(--print-ink);border-color:rgba(120,105,80,.5);background:#fff;}
  .lb-flipbtn .dot{
    width:5px;height:5px;border-radius:50%;background:var(--safelight);
  }
  .lb-card.flipped .lb-flipbtn{background:rgba(240,233,218,.9);}
  /* 左右两张是预备位，在屏幕外；它们的翻面按钮不该存在，
     否则 Tab 会聚焦到看不见的按钮上 */
  .lb-card:not(:nth-child(2)) .lb-flipbtn{display:none;}
  body.light .lb-frame{box-shadow:0 30px 70px rgba(90,75,55,.35);}
  .lb-card:first-child .lb-frame{transform:rotate(-9deg) scale(.86);}
  .lb-card:last-child  .lb-frame{transform:rotate(9deg) scale(.86);}
  .lb-track.anim .lb-frame{transition:transform .42s cubic-bezier(.22,.9,.3,1);}

  /* 换片：新到位的相纸先是欠曝模糊，很快显影清晰；同时像被夹子挂上一样摆两下 */
  .lb-track.swap .lb-card:nth-child(2) .lb-pic{
    animation:lbDevelop .75s cubic-bezier(.25,.7,.35,1) both;
  }
  @keyframes lbDevelop{
    0%  {filter:contrast(.3) brightness(1.6) sepia(.5) blur(6px);}
    35% {filter:contrast(.6) brightness(1.25) sepia(.28) blur(2px);}
    100%{filter:none;}
  }
  .lb-track.swap .lb-card:nth-child(2) .lb-frame{
    animation:lbSwing .8s cubic-bezier(.3,.6,.4,1) both;
  }
  @keyframes lbSwing{
    0%  {transform:rotate(var(--sw,6deg)) translateY(-10px) scale(.96);}
    38% {transform:rotate(calc(var(--sw,6deg) * -.4)) translateY(0) scale(1.008);}
    68% {transform:rotate(calc(var(--sw,6deg) * .18)) scale(.998);}
    100%{transform:none;}
  }
  /* 换片时一道暖光扫过相纸，像放大机的灯扫了一遍 */
  .lb-track.swap .lb-card:nth-child(2) .lb-zoom::before{
    animation:lbWipe .6s ease-out both;
  }
  @keyframes lbWipe{
    0%  {background:linear-gradient(105deg,transparent 0%,rgba(255,240,214,.5) 8%,transparent 22%);}
    100%{background:linear-gradient(105deg,transparent 78%,rgba(255,240,214,0) 92%,transparent 100%);}
  }

  .lightbox.first-open .lb-card:nth-child(2) .lb-frame{
    animation:lbIn .35s cubic-bezier(.22,.9,.3,1);
  }
  @keyframes lbIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}

  /* 缩放视口：裁剪被放大的画面；暗角与颗粒盖在最上层不随缩放 */
  .lb-zoom{position:relative;overflow:hidden;border-radius:1px;}
  .lb-pic{
    height:min(58vh,480px);
    background-size:cover;background-position:center;
    transform-origin:0 0;will-change:transform;
  }
  .lb-zoom::before{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(10,8,6,.32));
  }
  .lb-zoom::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background-image:var(--grain);opacity:.14;mix-blend-mode:overlay;
  }
  .lb-bar{
    display:flex;align-items:baseline;gap:14px;
    padding:15px 4px;color:var(--print-ink);
  }
  .lb-bar b{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.04em;}
  .lb-bar span{font-family:var(--mono);font-size:11.5px;color:var(--print-sub);letter-spacing:.08em;}
  .lb-bar .lb-place{color:#9A7B45;}

  .lb-nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:46px;height:46px;border-radius:50%;
    display:grid;place-items:center;
    color:var(--ivory);font-size:22px;
    border:1px solid rgba(237,229,216,.2);
    background:rgba(22,19,16,.5);
    transition:background .25s,border-color .25s;
  }
  body.light .lb-nav{background:rgba(255,253,246,.75);border-color:rgba(46,42,36,.2);}
  .lb-nav:hover{background:rgba(212,85,59,.35);border-color:var(--safelight);}
  .lb-prev{left:max(12px,calc(50% - min(300px,46vw) - 66px));}
  .lb-next{right:max(12px,calc(50% - min(300px,46vw) - 66px));}
  @media (hover:none){.lb-nav{display:none;}}

  .lb-close{
    position:absolute;top:20px;right:24px;z-index:2;
    font-family:var(--mono);font-size:12px;letter-spacing:.2em;
    color:var(--muted);padding:8px 10px;
  }
  .lb-close:hover{color:var(--ivory);}

  .lb-footer{
    position:absolute;left:0;right:0;bottom:20px;z-index:2;
    text-align:center;pointer-events:none;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.15em;
    color:var(--muted);
  }
  .lb-dots{
    display:inline-flex;align-items:center;gap:8px;
    pointer-events:auto;vertical-align:middle;
  }
  .lb-dots button{
    width:7px;height:7px;border-radius:4px;padding:0;
    background:var(--faint);opacity:.65;
    transition:width .3s ease,background-color .3s ease,opacity .3s ease;
  }
  .lb-dots button.act{width:22px;background:var(--amber);opacity:1;}
  .lb-count{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .lb-count b{color:var(--amber);font-weight:400;}
  .lb-swipe-hint{
    display:inline-block;margin-left:16px;color:var(--faint);
    transition:opacity .5s ease;
  }
  .lb-flip-hint{display:none;margin-left:16px;color:var(--faint);}
  @media (hover:hover){.lb-flip-hint:not([hidden]){display:inline-block;}}
  .lb-footer.hide-hint .lb-swipe-hint{opacity:0;}
  @media (hover:hover){.lb-swipe-hint{display:none;}}

  /* ============ 信箱 ============
     挂在页面角上的一只老式信箱。有没读过的信时旗子升起、投信口透出暖光。 */
  .mailbox{
    position:fixed;left:min(4vw,26px);bottom:26px;z-index:38;
    width:82px;height:88px;padding:0;
    display:none;place-items:end center;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));
    transition:transform .3s cubic-bezier(.3,.7,.35,1.3);
  }
  .mailbox.on{display:grid;}
  .mailbox:hover{transform:translateY(-3px) rotate(-1.5deg);}
  .mailbox:active{transform:translateY(0) scale(.97);}
  body.light .mailbox{filter:drop-shadow(0 6px 14px rgba(90,75,55,.3));}
  .mailbox svg{width:100%;height:100%;overflow:visible;}
  /* 三面各自的受光：正面板象牙白、顶面最亮、右侧壁背光 */
  .mb-f1{stop-color:#F3ECDD;} .mb-f2{stop-color:#E4DAC4;} .mb-f3{stop-color:#CFC3A8;}
  .mb-t1{stop-color:#E9E0CB;} .mb-t2{stop-color:#FBF6EA;}
  .mb-d1{stop-color:#BBAF95;} .mb-d2{stop-color:#95886E;}
  /* 铜饰边 */
  .mb-b1{stop-color:#F0CE8E;} .mb-b2{stop-color:#C9A159;} .mb-b3{stop-color:#8E6C31;}
  /* 木柱 */
  .mb-w1{stop-color:#3A2C1F;} .mb-w2{stop-color:#5C4630;} .mb-w3{stop-color:#2E2318;}
  .mb-wood-d{fill:rgba(0,0,0,.35);}
  .mb-wood-l{fill:rgba(255,232,190,.16);}
  .mb-rim{stroke:url(#mbBrass);}
  .mb-rim-in{stroke:rgba(255,240,205,.42);}
  .mb-rim-f{fill:url(#mbBrass);}
  .mb-slot{fill:#241C12;}
  .mb-slot-hi{stroke:rgba(255,235,195,.35);}
  .mb-emb rect{fill:none;stroke:url(#mbBrass);stroke-width:1.1;}
  .mb-emb-l{stroke:#C9A159;}
  .mb-hinge{fill:url(#mbBrass);}
  .mb-hinge-in{fill:rgba(80,58,26,.7);}
  .mb-flagcloth{fill:var(--safelight);}
  .mb-flag-sh{fill:none;stroke:rgba(90,20,10,.5);stroke-width:.8;}
  /* 亮色主题：箱体提亮、铜边压深，免得糊进浅色背景 */
  body.light .mb-f1{stop-color:#FFFCF4;} body.light .mb-f2{stop-color:#F2E9D6;}
  body.light .mb-f3{stop-color:#DCD0B6;}
  body.light .mb-t1{stop-color:#F5EEDC;} body.light .mb-t2{stop-color:#FFFEF9;}
  body.light .mb-d1{stop-color:#B4A78C;} body.light .mb-d2{stop-color:#8C7F66;}
  body.light .mb-b1{stop-color:#DCB469;} body.light .mb-b2{stop-color:#A9833C;}
  body.light .mb-b3{stop-color:#6F5220;}
  body.light .mb-w1{stop-color:#4A3826;} body.light .mb-w2{stop-color:#6B5238;}
  body.light .mb-w3{stop-color:#3B2C1D;}
  body.light .mb-slot{fill:#3A2C1C;}
  /* 旗子：有未读信时立起来 */
  .mb-flag{
    transform-origin:57.6px 60px;
    transform:rotate(96deg) scaleY(.46);
    transition:transform .6s cubic-bezier(.3,.7,.35,1.5);
  }
  .mailbox.has .mb-flag{transform:rotate(0deg) scaleY(1);}
  .mailbox.has .mb-flagcloth{animation:mbWave 2.8s ease-in-out infinite;transform-origin:58.8px 33px;}
  @keyframes mbWave{0%,100%{transform:skewY(0deg);}50%{transform:skewY(-3.5deg);}}
  /* 投信口的光：只有未读时透出来 */
  .mb-glow{opacity:0;transition:opacity .6s ease;}
  .mailbox.has .mb-glow{opacity:1;animation:mbGlow 3.2s ease-in-out infinite;}
  @keyframes mbGlow{0%,100%{opacity:.55;}50%{opacity:1;}}
  .mailbox.has{animation:mbNudge 4.5s ease-in-out 1.5s infinite;}
  @keyframes mbNudge{
    0%,92%,100%{transform:none;}
    94%{transform:rotate(-3deg);} 96%{transform:rotate(2.5deg);} 98%{transform:rotate(-1deg);}
  }
  .mb-count{
    position:absolute;top:-2px;left:-6px;
    min-width:19px;height:19px;padding:0 5px;border-radius:10px;
    background:var(--safelight);color:#fff;
    font-family:var(--mono);font-size:10.5px;line-height:19px;text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s;
  }
  .mailbox.has .mb-count{opacity:1;transform:none;}
  @media (max-width:600px){
    /* 和「回到顶部」并排站一行，比上下叠着清爽；右侧中部留给年份导航 */
    .mailbox{left:14px;bottom:16px;width:58px;height:64px;}
  }

  /* ---- 信件层：信封飞出 → 拆开 → 信纸展开 ---- */
  .letters{
    position:fixed;inset:0;z-index:97;display:none;
    background:rgba(12,10,8,.86);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    padding:24px;overflow-y:auto;
  }
  body.light .letters{background:rgba(240,235,225,.92);}
  .letters.on{display:block;}
  .lt-close{
    position:absolute;top:20px;right:24px;z-index:3;
    font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted);
    padding:8px 10px;
  }
  .lt-close:hover{color:var(--ivory);}
  .lt-head{
    max-width:640px;margin:6vh auto 0;text-align:center;
    font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--amber);
  }
  .lt-stack{max-width:640px;margin:26px auto 60px;display:flex;
    flex-direction:column;gap:16px;}

  /* 信封 */
  .env{
    position:relative;width:100%;aspect-ratio:16/9;max-height:210px;
    border-radius:6px;cursor:pointer;text-align:left;
    transition:max-height .5s cubic-bezier(.3,.7,.35,1),aspect-ratio .5s;
    background:linear-gradient(160deg,#F3EADA,#E4D8C2);
    box-shadow:0 8px 22px rgba(0,0,0,.4);
    overflow:hidden;
    animation:envIn .55s cubic-bezier(.25,.9,.35,1.1) backwards;
    transition:transform .3s cubic-bezier(.3,.7,.35,1.2),box-shadow .3s;
  }
  .env:nth-child(1){animation-delay:.05s;} .env:nth-child(2){animation-delay:.14s;}
  .env:nth-child(3){animation-delay:.23s;} .env:nth-child(n+4){animation-delay:.3s;}
  @keyframes envIn{
    /* 从信箱那个方向飞出来 */
    from{opacity:0;transform:translate(-46vw,46vh) rotate(-18deg) scale(.5);}
    to  {opacity:1;transform:none;}
  }
  .env:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 14px 30px rgba(0,0,0,.5);}
  /* 信封的折线：两侧斜边 + 封口三角 */
  .env::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to bottom right,transparent 49.4%,rgba(120,100,70,.22) 49.6%,transparent 50%),
      linear-gradient(to bottom left, transparent 49.4%,rgba(120,100,70,.22) 49.6%,transparent 50%);
  }
  .env-flap{
    position:absolute;left:0;right:0;top:0;height:52%;
    background:linear-gradient(180deg,#EFE4D0,#E2D5BC);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    box-shadow:0 2px 5px rgba(120,100,70,.18);
    transition:transform .5s cubic-bezier(.3,.7,.35,1.1);
  }
  .env.open .env-flap{transform:rotateX(-172deg);}
  /* 拆开后信封收成一条压在信纸上沿，像信纸被抽出来后随手搁在一旁 */
  .env-wrap.open .env{
    /* 只压高度，不动 aspect-ratio：内容都是绝对定位的，
       改成 auto 会让信封塌成 0 高，连点都点不中 */
    max-height:74px;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
  }
  .env-wrap.open .env:hover{transform:none;}
  .env-wrap.open .env-flap{opacity:0;transition:opacity .3s ease .2s,transform .5s;}
  .env-wrap.open .env-meta{bottom:12px;}
  .env-wrap.open .env::before{opacity:.35;}
  /* 火漆印 */
  .env-seal{
    position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 36% 32%,#E0674B,#B33F27 62%,#8E2F1C);
    box-shadow:0 2px 5px rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.3);
    display:grid;place-items:center;
    font-family:var(--serif);font-size:14px;color:rgba(255,240,225,.9);
    transition:transform .4s ease,opacity .4s ease;
  }
  .env.open .env-seal{transform:translate(-50%,-50%) scale(.4);opacity:0;}
  .env-meta{
    position:absolute;left:22px;right:22px;bottom:16px;z-index:2;
    color:#5A4E3C;
  }
  .env-title{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .env-sub{margin-top:3px;font-family:var(--mono);font-size:10.5px;color:#8B7C63;
    letter-spacing:.1em;display:flex;gap:10px;align-items:baseline;}
  .env-new{color:var(--safelight);}
  .env.read{background:linear-gradient(160deg,#EBE3D5,#DCD2BE);opacity:.86;}
  .env.read .env-seal{background:radial-gradient(circle at 36% 32%,#B9A88C,#96866C 62%,#7A6B54);}

  /* 信纸：从信封里抽出来，三折展开 */
  .paper{
    position:relative;margin-top:-10px;z-index:2;
    background:
      radial-gradient(120% 70% at 50% 0%,rgba(255,253,246,.7),transparent 65%),
      var(--paper-raw);
    border-radius:4px;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
    padding:clamp(24px,5%,40px) clamp(22px,6%,44px);
    transform-origin:top center;
    display:none;
  }
  .env-wrap.open .paper{display:block;animation:unfold .78s cubic-bezier(.28,.85,.35,1) both;}
  @keyframes unfold{
    /* 先被抽出来（压扁、靠上），再一节一节展平 */
    0%  {opacity:0;transform:perspective(1400px) rotateX(-88deg) scaleY(.35) translateY(-14px);}
    38% {opacity:1;transform:perspective(1400px) rotateX(-44deg) scaleY(.7);}
    72% {transform:perspective(1400px) rotateX(9deg) scaleY(1.02);}
    100%{transform:none;}
  }
  .paper::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:4px;
    background-image:var(--grain);opacity:.2;mix-blend-mode:multiply;
  }
  /* 折痕：信纸原本是三折的 */
  .paper::before{
    content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;
    background:linear-gradient(180deg,
      transparent 32.6%,rgba(120,100,70,.14) 33%,transparent 33.4%,
      transparent 66.2%,rgba(120,100,70,.14) 66.6%,transparent 67%);
  }
  .paper h4{
    font-family:var(--serif);font-size:19px;letter-spacing:.05em;color:#4A4030;
  }
  .paper .when{
    margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:#A2957E;
    padding-bottom:12px;border-bottom:1px dashed rgba(120,105,80,.3);
  }
  .paper .text{
    margin-top:18px;
    font-family:'Kaiti SC','KaiTi','STKaiti',var(--serif);
    font-size:clamp(15px,2.5vw,17.5px);line-height:2.15;color:#544A3A;
    white-space:pre-wrap;word-break:break-word;
  }
  .paper .from{
    margin-top:22px;text-align:right;
    font-family:'Kaiti SC','KaiTi','STKaiti',var(--serif);
    font-size:15px;color:#6B5F4C;
  }
  .lt-empty{
    max-width:640px;margin:24px auto;text-align:center;
    font-family:var(--mono);font-size:12px;letter-spacing:.15em;color:var(--faint);
  }

  /* 回到顶部：逆序时间轴越翻越远，回头看最近的照片得一路滚回去 */
  .totop{
    position:fixed;right:min(4vw,26px);bottom:26px;z-index:38;
    width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;
    font-size:17px;line-height:1;color:var(--ivory);
    background:rgba(29,25,21,.94);border:1px solid rgba(237,229,216,.3);
    box-shadow:0 4px 16px rgba(0,0,0,.5);
    opacity:0;transform:translateY(10px);pointer-events:none;
    transition:opacity .3s ease,transform .3s ease,background .25s,border-color .25s;
  }
  body.light .totop{
    background:rgba(255,253,246,.96);border-color:rgba(46,42,36,.25);
    box-shadow:0 4px 16px rgba(90,75,55,.25);
  }
  .totop.on{opacity:1;transform:none;pointer-events:auto;}
  .totop:hover{background:var(--safelight);border-color:var(--safelight);color:#fff;}

  footer{
    position:relative;z-index:1;
    max-width:960px;margin:0 auto;padding:0 28px 64px;
    color:var(--muted);font-family:var(--sans);font-weight:400;
    font-size:12.5px;letter-spacing:.1em;text-align:center;
  }

  /* ============ 开场：暗房亮灯（仅首次加载，body.boot 期间生效） ============ */
  @media (prefers-reduced-motion:no-preference){
    body.boot .cord{
      animation:cordDrop .7s cubic-bezier(.3,.7,.35,1.25) .15s backwards,
                cordPull .55s cubic-bezier(.3,.7,.35,1.3) 1.05s;
    }
    body.boot::before{animation:glowOn 1.25s ease-out 1.15s backwards;}
    body.boot .intro{animation:introDev .85s cubic-bezier(.22,.9,.3,1) backwards;}
    body.boot .i1{animation-delay:1.2s;}
    body.boot .i2{animation-delay:1.34s;}
    body.boot .i3{animation-delay:1.5s;}
    body.boot .i4{animation-delay:1.66s;}
    body.boot .i5{animation-delay:1.8s;}
    body.boot .year-nav{animation:navIn .8s ease 2s backwards;}
    body.boot .timeline::before{
      animation:spineDraw 1.1s cubic-bezier(.22,.9,.3,1) 1.95s backwards;
      transform-origin:top;
    }
  }
  @keyframes cordDrop{from{transform:translateY(-110%);}to{transform:translateY(0);}}
  @keyframes glowOn{      /* 钨丝灯暖机般的闪烁 */
    0%{opacity:0;} 30%{opacity:.5;} 42%{opacity:.12;}
    58%{opacity:.85;} 70%{opacity:.55;} 100%{opacity:1;}
  }
  @keyframes introDev{    /* 标题如相纸显影般浮现 */
    from{opacity:0;transform:translateY(16px);filter:brightness(1.5) sepia(.4) blur(4px);}
    to  {opacity:1;transform:none;filter:none;}
  }
  @keyframes navIn{from{opacity:0;}to{opacity:1;}}
  @keyframes spineDraw{from{transform:scaleY(0);}to{transform:scaleY(1);}}

  @media (prefers-reduced-motion:no-preference){
    .reveal{opacity:0;transform:translateY(20px);
      transition:opacity .7s ease,transform .7s cubic-bezier(.22,.9,.3,1);}
    .reveal.in{opacity:1;transform:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important;animation:none !important;}
    html{scroll-behavior:auto;}
  }

  @media (max-width:600px){
    :root{--pw:134px;--ph:120px;--peek:34px;}
    .wrap{padding:0 20px;}
    header{padding-top:56px;}
    .timeline{padding-left:32px;}
    .node::before{left:-27px;}

    .year-nav .yr.act span{opacity:1;}
    .totop{right:auto;left:80px;bottom:28px;width:40px;height:40px;}
  }
</style>

<script>
/* ================= 通用工具 =================
   安全修复：所有动态文本一律走 textContent 或 esc() 转义后再插值，
   杜绝原型中模板字符串 + innerHTML 直插 caption/title/description 的存储型 XSS */
const API = '/api/v1';
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ================= 主题：与管理后台共用 localStorage 键 sg_theme ================= */
if(localStorage.getItem('sg_theme') === 'light') document.body.classList.add('light');

/* ================= 浏览器端 BlurHash 解码（约 1KB，画到 canvas 当占位图） ================= */
const B83 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#$%*+,-.:;=?@[]^_{|}~';
function b83d(s){ let v = 0; for(const c of s) v = v * 83 + B83.indexOf(c); return v; }
function s2l(v){ v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
function l2s(v){ v = Math.max(0, Math.min(1, v));
  return Math.round((v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055) * 255); }
function sPow(v, e){ return Math.sign(v) * Math.pow(Math.abs(v), e); }
function bhDecode(hash, w, h){
  const sf = b83d(hash[0]), ny = Math.floor(sf / 9) + 1, nx = sf % 9 + 1;
  const qm = (b83d(hash[1]) + 1) / 166;
  const colors = [];
  const dc = b83d(hash.substring(2, 6));
  colors.push([s2l(dc >> 16), s2l(dc >> 8 & 255), s2l(dc & 255)]);
  for(let i = 1; i < nx * ny; i++){
    const v = b83d(hash.substring(4 + i * 2, 6 + i * 2));
    colors.push([sPow((Math.floor(v / 361) - 9) / 9, 2) * qm,
                 sPow((Math.floor(v / 19) % 19 - 9) / 9, 2) * qm,
                 sPow((v % 19 - 9) / 9, 2) * qm]);
  }
  const px = new Uint8ClampedArray(w * h * 4);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    let r = 0, g = 0, b = 0;
    for(let j = 0; j < ny; j++) for(let i = 0; i < nx; i++){
      const basis = Math.cos(Math.PI * x * i / w) * Math.cos(Math.PI * y * j / h);
      const c = colors[i + j * nx];
      r += c[0] * basis; g += c[1] * basis; b += c[2] * basis;
    }
    const o = (y * w + x) * 4;
    px[o] = l2s(r); px[o + 1] = l2s(g); px[o + 2] = l2s(b); px[o + 3] = 255;
  }
  return px;
}
function blurhashURL(hash, w = 32, h = 24){
  try{
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').putImageData(new ImageData(bhDecode(hash, w, h), w, h), 0, 0);
    return c.toDataURL();
  }catch(_){ return ''; }
}

/* ================= 滚动显影（开场结束后再启动，避免抢戏） ================= */
const io = new IntersectionObserver(es => {
  es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
}, {threshold:.12});
let revealActive = false;
const revealQueue = [];
function observeReveal(el){
  el.classList.add('reveal');
  if(revealActive) io.observe(el); else revealQueue.push(el);
}
const bootDelay = reduceMotion ? 0 : 900;
setTimeout(() => { revealActive = true; revealQueue.splice(0).forEach(el => io.observe(el)); }, bootDelay);
setTimeout(() => document.body.classList.remove('boot'), reduceMotion ? 0 : 3200);

/* ================= 显影加载管线 =================
   blurhash 占位先上盘 → 真实 Image.onload 驱动显影；pending/processing 保持
   未显影相纸并每 3s 轮询；failed 盖“曝光失败”章，title 带 fail_reason */
function paintBlurhash(pic, p){
  if(pic._bh || !p.blurhash) return;
  pic._bh = 1;
  const u = blurhashURL(p.blurhash);
  if(u){ pic.style.backgroundImage = `url('${u}')`; pic.style.backgroundSize = 'cover'; }
  else if(p.dominant){ pic.style.backgroundColor = p.dominant; }
}
function develop(photoEl, fast = false){
  const p = photoEl._photo;
  if(!p) return;
  const pic = photoEl.querySelector('.pic');
  const img = photoEl.querySelector('.ph-img');
  if(p.status === 'failed'){
    pic.classList.add('failed');
    pic.querySelector('.fail').title = p.fail_reason || '';
    return;
  }
  if(p.status !== 'ready'){       /* 显影中：轮询等待 */
    watchPhoto(photoEl);
    return;
  }
  if(photoEl._loaded) return;
  photoEl._loaded = true;
  pic.classList.remove('failed');
  paintBlurhash(pic, p);
  const url = p.variants && p.variants.thumb;
  if(!url) return;
  const pre = new Image();
  pre.onload = () => { img.style.backgroundImage = `url('${url}')`;
                       requestAnimationFrame(() => img.classList.add('dev')); };
  pre.onerror = () => pic.classList.add('failed');
  pre.src = url;
}

/* 3s 轮询 pending/processing 的照片直至 ready/failed */
const watchMap = new Map();
let pollTimer = null;
function watchPhoto(el){
  const p = el._photo;
  if(!p || watchMap.has(p.id)) return;
  watchMap.set(p.id, el);
  paintBlurhash(el.querySelector('.pic'), p);
  if(!pollTimer) pollTimer = setInterval(pollTick, 3000);
}
async function pollTick(){
  for(const [id, el] of [...watchMap]){
    try{
      const res = await fetch(`${API}/photos/${id}`);
      if(res.status === 404){ watchMap.delete(id); continue; }
      if(!res.ok) continue;
      const p = await res.json();
      if(p.status === 'ready' || p.status === 'failed'){
        watchMap.delete(id);
        el._photo = p; el._loaded = false;
        develop(el, true);
      }
    }catch(_){}
  }
  if(!watchMap.size){ clearInterval(pollTimer); pollTimer = null; }
}

/* 懒加载：照片带接近视口时先显影“封面”那张 */
const lazyIO = new IntersectionObserver(es => {
  es.forEach(en => {
    if(!en.isIntersecting) return;
    /* 折叠摞里露脸的 6 张全部先显影：顶上的封面不能是一张空白相纸 */
    [...en.target.querySelectorAll('.photo')].slice(0, 6).forEach(p => develop(p));
    lazyIO.unobserve(en.target);
  });
}, {rootMargin:'400px 0px'});

/* 展开的照片带完全滚出视口时，自动收起 */
const autoClose = new IntersectionObserver(es => {
  es.forEach(en => {
    if(en.isIntersecting) return;
    const node = en.target.closest('.node');
    if(node?.classList.contains('open')){
      node.classList.remove('open');
      node.querySelector('.node-head').setAttribute('aria-expanded','false');
      node.querySelectorAll('.photo').forEach(p => p.tabIndex = -1);
      clearTimeout(node._shrinkT);
      node._shrinkT = setTimeout(() => shrinkStrip(node), 2000);
    }
  });
}, {threshold:0});

/* ================= 渲染时间轴（游标分页增量渲染） ================= */
const FOLD_N = 6;                     /* 折叠摞露出的张数，与 CSS 的 nth-of-type(n+7) 对齐 */
const tl = document.getElementById('timeline');
const yearNav = document.getElementById('yearNav');
let nextCursor = null, loading = false, firstLoad = true, done = false;
let lastYear = '';
const years = [];
let yrBtns = [];

function refreshYearNav(){
  yearNav.innerHTML = years.map(y =>
    `<button class="yr" data-year="${esc(y)}"><span>${esc(y)}</span><i aria-hidden="true"></i></button>`).join('');
  yrBtns = [...yearNav.querySelectorAll('.yr')];
  spy();
}

function buildPhoto(p, date, i){
  const fig = document.createElement('figure');
  fig.className = 'photo';
  fig.setAttribute('role','button');
  fig.tabIndex = -1;
  fig.dataset.i = i;
  fig.dataset.date = date;

  fig._photo = p;

    <span class="clip" aria-hidden="true"></span>

      <div class="pic"><span class="ph-img"></span><i class="fail">曝光失败</i></div>
      <figcaption><i>No.${String(i + 1).padStart(2,'0')}</i><b></b></figcaption>
    </div>`;
  fig.querySelector('figcaption b').textContent = p.caption;
  fig.setAttribute('aria-label', '查看：' + p.caption);
  return fig;
}

function buildNode(n){

  if(n.place) art.querySelector('.node-place span').textContent = n.place;
  art.dataset.id = n.id;
  art._total = n.photo_count;          /* 真实总数：首屏只发了前几张 */
  if(!n.photo_count) art.classList.add('is-empty');
  art.querySelector('.strip-note').textContent = n.photo_count ? '正在取出相纸……' : '这一天还没有照片';

  n.photos.forEach((p, i) => strip.appendChild(buildPhoto(p, n.date, i)));

/* 每张相纸挂上晾片线的角度、木夹位置、入场延迟都带点随机，避免排得像标本 */
function scatter(photos){
  photos.forEach(p => {
    p.style.setProperty('--rot',  (Math.random() * 2.6 - 1.3).toFixed(2) + 'deg');
    p.style.setProperty('--clipx',(Math.random() * 22  - 11 ).toFixed(0) + 'px');
    p.style.setProperty('--d',    (Math.min(+p.dataset.i, 12) * .05 + .18).toFixed(2) + 's');
  });
}

/* 展开时补齐照片：首屏每个节点只发了 FOLD_N 张，其余按 id 拉全节点。
   同一节点重复触发共用一个 in-flight Promise。 */
function ensureAllPhotos(node){
  if(node._full) return Promise.resolve();
  if(node.querySelectorAll('.photo').length >= (node._total || 0)){
    node._full = true;
    return Promise.resolve();
  }
  /* 之前展开过、收起时被回收了 DOM：用缓存的照片数据重建，不必再请求 */
  if(node._cache){
    fillStrip(node, node._cache, node._date);
    node._full = true;
    return Promise.resolve();
  }
  if(node._loading) return node._loading;
  node._loading = fetch(`${API}/nodes/${encodeURIComponent(node.dataset.id)}`)
    .then(res => { if(!res.ok) throw new Error(String(res.status)); return res.json(); })
    .then(n => {
      fillStrip(node, n.photos, n.date);
      node._cache = n.photos;
      node._full = true;
      node._total = n.photos.length;
    })
    .finally(() => { node._loading = null; });
  return node._loading;
}

/* 用整套照片重建晾片带（钢丝保留，只换相纸） */
function fillStrip(node, photos, date){
  const strip = node.querySelector('.strip');
  strip.querySelectorAll('.photo').forEach(el => el.remove());
  photos.forEach((p, i) => strip.appendChild(buildPhoto(p, date, i)));
  scatter(strip.querySelectorAll('.photo'));
}

/* 收起后回收 DOM：折叠摞只露 FOLD_N 张，多出来的相纸留在文档里纯属占用。
   一个 192 张的节点展开后会让整页 DOM 涨到三倍，逛几个大节点就上万元素。
   照片数据留在 node._cache，再次展开直接重建，不重新请求。 */
function shrinkStrip(node){
  if(node.classList.contains('open') || !node._full) return;
  const ps = [...node.querySelectorAll('.photo')];
  if(ps.length <= FOLD_N) return;
  node._stripIO?.disconnect();
  node._stripIO = null;
  if(!node._cache) node._cache = ps.map(el => el._photo).filter(Boolean);
  ps.slice(FOLD_N).forEach(el => el.remove());
  node._full = false;
}

/* 横向懒加载：只显影滚进晾片带视口（含左右各一屏预取）的相纸。
   一个 192 张的节点展开时不该一次发 192 个缩略图请求。 */
function stripLazy(node){
  const wrap = node.querySelector('.strip-wrap');
  if(node._stripIO) node._stripIO.disconnect();
  node._stripIO = new IntersectionObserver(es => {
    es.forEach(en => {
      if(!en.isIntersecting) return;
      develop(en.target);
      node._stripIO.unobserve(en.target);
    });
  }, {root: wrap, rootMargin: '0px 100%'});
  node.querySelectorAll('.photo').forEach(el => node._stripIO.observe(el));
}

/* 晾片带用 roving tabindex：整条带在 Tab 序列里只占一格，带内靠方向键移动。
   192 张照片全部可 Tab 的话，键盘用户要按 192 次才能走过一个节点。 */
function roving(node, target){
  const ps = [...node.querySelectorAll('.photo')];
  if(!ps.length) return null;
  const el = target && ps.includes(target) ? target : ps[0];
  ps.forEach(p => p.tabIndex = p === el ? 0 : -1);
  return el;
}

/* 节点展开 / 收起 + 桌面端按住拖动横滚 */
function bindNode(node){
  const head = node.querySelector('.node-head');
  const wrap = node.querySelector('.strip-wrap');
  const toggle = () => {
    const open = node.classList.toggle('open');
    head.setAttribute('aria-expanded', open);
    if(open) roving(node);
    else node.querySelectorAll('.photo').forEach(p => p.tabIndex = -1);
    node._updateNav?.();
    clearTimeout(node._shrinkT);
    if(!open) node._shrinkT = setTimeout(() => shrinkStrip(node), 2000);
    if(open){
      wrap.scrollLeft = 0;
      /* 钢丝先拉开，照片补齐后再挂上；只显影滚到眼前的那几张 */
      const full = ensureAllPhotos(node);
      if(node._loading) wrap.classList.add('loading');
      full.then(() => {
        wrap.classList.remove('loading');
        node.classList.toggle('is-empty', !node.querySelector('.photo'));
        if(!node.classList.contains('open')){
          /* 补拉还在路上时用户就收起了：这批相纸同样要回收 */
          clearTimeout(node._shrinkT);
          node._shrinkT = setTimeout(() => shrinkStrip(node), 2000);
          return;
        }
        roving(node);
        stripLazy(node);
        node._updateNav?.();
      }).catch(() => {
        wrap.classList.remove('loading');
        node.querySelector('.strip-note').textContent = '照片加载失败，收起再展开可重试';
        node.classList.add('is-empty');
        stripLazy(node);
      });
      setTimeout(() => node._updateNav?.(), 700);   /* 等 margin 过渡结束宽度定型 */
      const wire = node.querySelector('.wire');
      if(wire) wire.style.transformOrigin = (wrap.clientWidth / 2) + 'px 50%';
      requestAnimationFrame(() => {
        const r = wrap.getBoundingClientRect();
        const need = r.bottom - (innerHeight - 16);
        if(need > 0){
          const room = Math.max(0, r.top - 96);
          if(room > 0) window.scrollBy({top: Math.min(need, room), behavior:'smooth'});
        }
      });
    }
  };
  head.addEventListener('click', toggle);
  wrap.addEventListener('click', () => { if(!node.classList.contains('open')) toggle(); });

  /* 桌面端：翻页按钮 + 普通滚轮直接横滚晾片带 */
  const outer = node.querySelector('.strip-outer');
  const updateNav = () => {
    const ok = node.classList.contains('open') && wrap.scrollWidth > wrap.clientWidth + 4;
    outer.classList.toggle('can-l', ok && wrap.scrollLeft > 4);
    outer.classList.toggle('can-r', ok && wrap.scrollLeft < wrap.scrollWidth - wrap.clientWidth - 4);
  };
  node._updateNav = updateNav;
  wrap.addEventListener('scroll', () => requestAnimationFrame(updateNav), {passive:true});
  node.querySelector('.s-prev').addEventListener('click',
    () => wrap.scrollBy({left: -wrap.clientWidth * .75, behavior:'smooth'}));
  node.querySelector('.s-next').addEventListener('click',
    () => wrap.scrollBy({left:  wrap.clientWidth * .75, behavior:'smooth'}));
  wrap.addEventListener('wheel', e => {
    if(!node.classList.contains('open')) return;
    if(wrap.scrollWidth <= wrap.clientWidth) return;
    if(Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;   /* 触控板横向手势交给浏览器 */
    let d = e.deltaY;
    if(e.deltaMode === 1) d *= 32;                         /* Firefox 行模式 */
    const atStart = wrap.scrollLeft <= 0;
    const atEnd = wrap.scrollLeft >= wrap.scrollWidth - wrap.clientWidth - 1;
    if((d < 0 && !atStart) || (d > 0 && !atEnd)){          /* 到边缘后放行整页滚动 */
      e.preventDefault();
      wrap.scrollLeft += d;
    }
  }, {passive:false});

  let down = false, sx = 0, sl = 0, moved = false;
  wrap.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse') return;
    if(!node.classList.contains('open')) return;
    down = true; moved = false; sx = e.clientX; sl = wrap.scrollLeft;
  });
  wrap.addEventListener('pointermove', e => {
    if(!down) return;
    const d = e.clientX - sx;
    if(Math.abs(d) > 6){ moved = true; wrap.classList.add('dragging'); }
    if(moved) wrap.scrollLeft = sl - d;
  });
  const end = () => { down = false; wrap.classList.remove('dragging'); };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointerleave', end);
  wrap.addEventListener('click', e => {
    if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);

  lazyIO.observe(wrap);
  autoClose.observe(wrap);
}

/* ================= 弹层焦点 =================
   弹层打开时 Tab 不该走进被遮罩盖住的背景——那里的东西看不见也点不着。
   灯箱本来就把焦点圈住了，后加的信箱与地点弹层沿用同一套。 */
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),' +
  'select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';

function trapFocus(box){
  const prev = document.activeElement;
  const onKey = e => {
    if(e.key !== 'Tab') return;
    const items = [...box.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null);
    if(!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if(e.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))){
      e.preventDefault(); last.focus();
    }else if(!e.shiftKey && (document.activeElement === last || !box.contains(document.activeElement))){
      e.preventDefault(); first.focus();
    }
  };
  document.addEventListener('keydown', onKey, true);
  return () => {
    document.removeEventListener('keydown', onKey, true);
    prev?.focus?.();
  };
}

/* ================= 地点：同一处的其它日子 ================= */
const placeBox = document.getElementById('placeBox');
const placeList = document.getElementById('placeList');
document.getElementById('placeClose').addEventListener('click', () => closePlace());
placeBox.addEventListener('click', e => { if(e.target === placeBox) closePlace(); });

function closePlace(){
  placeBox.classList.remove('on');

}

async function openPlace(place){
  document.getElementById('placeTitle').textContent = '';
  const h = document.getElementById('placeTitle');
  h.append(place);
  const sp = document.createElement('span'); sp.textContent = '同一处的日子';
  h.append(sp);
  placeList.textContent = '正在翻找……';
  placeBox.classList.add('on');
  placeRelease = trapFocus(placeBox.querySelector('.box'));
  setTimeout(() => document.getElementById('placeClose').focus(), 20);
  try{
    const res = await fetch(`${API}/places/${encodeURIComponent(place)}`);
    if(!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    placeList.textContent = '';
    if(!data.items.length){ placeList.textContent = '这里还没有别的日子'; return; }
    data.items.forEach(n => {
      const b = document.createElement('button');
      b.className = 'place-row';
      b.dataset.date = n.date;
      const th = document.createElement('span');
      th.className = 'th';
      const cover = n.photos?.[0]?.variants?.thumb;
      if(cover) th.style.backgroundImage = `url('${cover}')`;
      const wrap = document.createElement('span');
      const d = document.createElement('span'); d.className = 'd'; d.textContent = n.date;
      const t = document.createElement('span'); t.className = 't'; t.textContent = ' ' + n.title;
      wrap.append(d, t);
      const c = document.createElement('span'); c.className = 'c'; c.textContent = '×' + n.photo_count;
      b.append(th, wrap, c);
      b.addEventListener('click', () => jumpToNode(n.id, n.date));
      placeList.appendChild(b);
    });
  }catch(_){
    placeList.textContent = '没能翻出来，稍后再试';
  }
}

/* 跳到某个节点：已在页面上就滚过去，否则一路翻页找到它 */
async function jumpToNode(id, date){
  closePlace();
  let el = tl.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
  let guard = 0;
  while(!el && !done && guard++ < 30){
    await loadPage();
    el = tl.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
  }
  if(!el){ return; }
  el.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block: 'center'});
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1600);
  if(!el.classList.contains('open')) el.querySelector('.node-head').click();
}

/* ================= 信箱 =================
   有信才出现。未到投递时间的信在服务端就被挡掉了，前端拿到的都是能读的。 */
const mailbox  = document.getElementById('mailbox');
const lettersEl= document.getElementById('letters');
const ltStack  = document.getElementById('ltStack');
let letters = [], lettersLoaded = false;

function paintMailbox(){
  const unread = letters.filter(l => !l.read_at).length;
  mailbox.classList.toggle('on', letters.length > 0);
  mailbox.classList.toggle('has', unread > 0);
  document.getElementById('mbCount').textContent = unread;
  mailbox.setAttribute('aria-label',
    unread ? `信箱：${unread} 封未读` : `信箱：${letters.length} 封信`);
}

async function loadLetters(){
  try{
    const res = await fetch(`${API}/letters`);
    if(!res.ok) return;
    const data = await res.json();
    letters = data.items || [];
    lettersLoaded = true;
    paintMailbox();
  }catch(_){}
}

function renderLetters(){
  ltStack.textContent = '';
  document.getElementById('ltHead').textContent =
    letters.length ? `信箱 · ${letters.length} 封` : '信箱';
  if(!letters.length){
    const p = document.createElement('p');
    p.className = 'lt-empty';
    p.textContent = '信箱是空的';
    ltStack.appendChild(p);
    return;
  }
  letters.forEach(l => {
    const wrap = document.createElement('div');
    wrap.className = 'env-wrap';

    const env = document.createElement('button');
    env.className = 'env' + (l.read_at ? ' read' : '');
    env.type = 'button';
    env.setAttribute('aria-expanded', 'false');
    const flap = document.createElement('span'); flap.className = 'env-flap';
    const seal = document.createElement('span'); seal.className = 'env-seal'; seal.textContent = '拾';
    const meta = document.createElement('span'); meta.className = 'env-meta';
    const t = document.createElement('span'); t.className = 'env-title'; t.textContent = l.title;
    const sub = document.createElement('span'); sub.className = 'env-sub';
    const when = document.createElement('span'); when.textContent = l.deliver_at.slice(0, 10);
    sub.appendChild(when);
    if(l.sender){
      const from = document.createElement('span'); from.textContent = '来自 ' + l.sender;
      sub.appendChild(from);
    }
    if(!l.read_at){
      const nw = document.createElement('span'); nw.className = 'env-new'; nw.textContent = '● 未读';
      sub.appendChild(nw);
    }
    meta.append(t, sub);
    env.append(flap, seal, meta);

    const paper = document.createElement('div');
    paper.className = 'paper';
    const h = document.createElement('h4'); h.textContent = l.title;
    const w = document.createElement('p'); w.className = 'when';
    w.textContent = l.deliver_at.slice(0, 10).replace(/-/g, ' / ');
    const body = document.createElement('div'); body.className = 'text'; body.textContent = l.body;
    paper.append(h, w, body);
    if(l.sender){
      const f = document.createElement('p'); f.className = 'from'; f.textContent = '—— ' + l.sender;
      paper.appendChild(f);
    }

    env.addEventListener('click', () => openLetter(wrap, env, l));
    wrap.append(env, paper);
    ltStack.appendChild(wrap);
  });
}

/* 拆信：封口翻开 → 信纸抽出展开；再点一次折回 */
async function openLetter(wrap, env, l){
  const opening = !wrap.classList.contains('open');
  if(!opening){
    wrap.classList.remove('open');
    env.classList.remove('open');
    env.setAttribute('aria-expanded', 'false');
    return;
  }
  env.classList.add('open');
  env.setAttribute('aria-expanded', 'true');
  /* 封口先翻开，信纸随后抽出来 */
  setTimeout(() => {
    wrap.classList.add('open');
    wrap.querySelector('.paper')?.scrollIntoView({
      behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest'});
  }, reduceMotion ? 0 : 260);

  if(l.read_at) return;
  try{
    const res = await fetch(`${API}/letters/${encodeURIComponent(l.id)}`);
    if(!res.ok) return;
    const fresh = await res.json();
    l.read_at = fresh.read_at;
    env.classList.add('read');
    env.querySelector('.env-new')?.remove();
    paintMailbox();
  }catch(_){}
}

/* 无限滚动：底部哨兵 + next_cursor */
const sentinel = document.createElement('div');
sentinel.style.height = '1px';
document.querySelector('main').appendChild(sentinel);
const sentinelIO = new IntersectionObserver(es => {
  es.forEach(e => { if(e.isIntersecting && !done && !loading && !firstLoad) loadPage(); });
}, {rootMargin:'600px 0px'});

async function loadPage(){
  if(loading || done) return;
  loading = true;
  try{
    /* photo_limit：首屏每节点只取折叠摞露出的那几张，展开时再按 id 拉全部。
       几百张的节点整摞下发会让首屏 JSON 涨到几百 KB。 */
    const q = (nextCursor ? `?cursor=${encodeURIComponent(nextCursor)}&limit=10` : '?limit=10')
      + `&photo_limit=${FOLD_N}`;
    const res = await fetch(API + '/timeline' + q);
    if(!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    data.items.forEach(buildNode);
    nextCursor = data.next_cursor;
    if(!nextCursor){ done = true; sentinelIO.disconnect(); }
    spy();
  }catch(err){
    if(firstLoad){
      tl.textContent = '';
      const msg = document.createElement('p');
      msg.style.cssText = 'color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.15em;padding:40px 0';
      msg.textContent = err.message === '401' ? '相册未公开，需要访问授权' : '时间轴加载失败，请稍后刷新重试';
      tl.appendChild(msg);
      done = true;
    }
  }finally{
    loading = false;
    firstLoad = false;
  }
}

const lbRGB = ()=> document.body.classList.contains('light') ? '243,238,228' : '14,12,10';
/* 灯箱用 md 变体；所有文本与 URL 一律 esc() 后插值 */
const cardHTML = p => `

/* ---- 缩放状态 ---- */
let zs=1, ztx=0, zty=0, pinch0=null, pan0=null, lastTap={t:0,x:0,y:0};
const centerPic = ()=> track.children[1]?.querySelector('.lb-pic');
const zoomRect  = ()=> track.children[1]?.querySelector('.lb-zoom')?.getBoundingClientRect();
function applyZoom(anim=false){
  const pic = centerPic(); if(!pic) return;
  /* 双指放大超过 2x 时切换到 lg 大图 */
  if(zs > 2 && pic.dataset.lg && !pic._lgUp){
    pic._lgUp = 1;
    const url = pic.dataset.lg, im = new Image();
    im.onload = () => { pic.style.backgroundImage = `url('${url}')`; };
    im.src = url;
  }
  pic.style.transition = anim && !reduceMotion
    ? 'transform .3s cubic-bezier(.22,.9,.3,1)' : 'none';
  pic.style.transform = `translate(${ztx}px,${zty}px) scale(${zs})`;
}
function clampPan(){
  const r = zoomRect(); if(!r) return;
  ztx = Math.min(0, Math.max(r.width *(1-zs), ztx));
  zty = Math.min(0, Math.max(r.height*(1-zs), zty));
}
function resetZoom(anim=false){ zs=1; ztx=0; zty=0; applyZoom(anim); }

function setX(px, animate=false){
  const on = animate && !reduceMotion;
  track.style.transition = on ? 'transform .42s cubic-bezier(.22,.9,.3,1)' : 'none';
  track.classList.toggle('anim', on);
  track.style.transform = `translateX(${-W + px}px)`;
}
function parallax(px){
  const fs = [...track.children].map(c=>c.firstElementChild);
  if(fs.length<3) return;
  const t  = Math.max(-1, Math.min(1, px / W));
  const p0 = Math.max(0,  t);
  const p2 = Math.max(0, -t);
  fs[0].style.transform = `rotate(${-9*(1-p0)}deg) scale(${.86+.14*p0})`;
  fs[1].style.transform = `rotate(${-9*t}deg) scale(${1-.14*Math.abs(t)})`;
  fs[2].style.transform = `rotate(${ 9*(1-p2)}deg) scale(${.86+.14*p2})`;
}
const DOTS_MAX = 12;                  /* 再多就铺不下，改用计数 */
function renderDots(){
  if(album.length > DOTS_MAX){
    lbDots.innerHTML = '';
    const c = document.createElement('span');

    `<button class="${i===idx?'act':''}" aria-label="第 ${i+1} 张，共 ${album.length} 张"></button>`).join('');
}
function renderPanes(){
  W = viewport.clientWidth;
  /* 每次换页都是新 DOM，翻转状态自然复位 */
  zs=1; ztx=0; zty=0;                       /* 换页即重置缩放 */
  track.innerHTML =
    cardHTML(album[wrapIdx(idx-1)]) + cardHTML(album[idx]) + cardHTML(album[wrapIdx(idx+1)]);
  setX(0);
